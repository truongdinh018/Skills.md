"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"$L6\",{},null,false,null]},null,false,\"$7\"]},null,false,null],\"$L8\",false]],\"m\":\"$undefined\",\"G\":[\"$9\",[\"$La\"]],\"S\":true,\"h\":null,\"r\":\"$undefined\",\"s\":\"$undefined\",\"a\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"2yRusAtmwn0h4PvDKFO5c\"}\nb:\"$Sreact.suspense\"\nc:I[42724,[\"/Skills.md/_next/static/chunks/0do-rrmaskjy7.js\",\"/Skills.md/_next/static/chunks/2bbdxo6e8qew7.js\"],\"SkillBrowser\"]\n41:I[97367,[\"/Skills.md/_next/static/chunks/0do-rrmaskjy7.js\"],\"ViewportBoundary\"]\n43:I[97367,[\"/Skills.md/_next/static/chunks/0do-rrmaskjy7.js\"],\"MetadataBoundary\"]\nd:T6d6,\n## Mục tiêu\n\nĐảm bảo dự án **luôn đủ tiền chi trả** cho nhân công, vật tư và thầu phụ — kiểm soát *thời điểm* thu/chi chứ không chỉ tổng số.\n\n## Vì sao quan trọng\n\nTrong xây dựng, chi phí thường **chi ra trước** (tạm ứng, mua vật tư) nhưng giá trị nghiệm thu **thu về sau**. Chênh lệch thời điểm này gây thiếu hụt vốn lưu động, buộc phải giãn tiến độ.\n\n## Các bước lập dự báo dòng tiền\n\n1. **Gắn dòng tiền với tiến độ** — phân bổ chi phí theo tuần/tháng dựa trên kế hoạch thi công.\n2. **Lập dòng tiền vào** — theo mốc nghiệm thu và thời hạn thanh toán trong hợp đồng, trừ phần giữ lại (retention).\n3. **Lập dòng tiền ra** — lương, vật tư, thầu phụ, máy móc, chi phí chung.\n4. **Tính dòng tiền ròng lũy kế** — phát hiện các thời điểm âm.\n5. **Lập phương án bù** — tạm ứng, tín dụng, đàm phán mốc thanh toán.\n\n## Bảng dòng tiền mẫu\n\n| Chỉ tiêu | T1 | T2 | T3 |\n| --- | --- | --- | --- |\n| Tiền vào | 0 | 800 | 1.200 |\n| Tiền ra | 600 | 900 | 1.000 |\n| Ròng trong kỳ | -600 | -100 | 200 |\n| Lũy kế | -600 | -700 | -500 |\n\n## Checklist kiểm soát\n\n- [ ] Cập nhật dự báo hàng tháng theo tiến độ thực tế\n- [ ] Theo dõi công nợ phải thu và phần giữ lại\n- [ ] Cảnh báo sớm các kỳ dòng tiền âm\n- [ ] Gắn kế hoạch thanh toán thầu phụ với dòng tiền vào\n\n\u003e **Lưu ý:** Nhiều dự án \"có lãi trên giấy\" vẫn chết vì **thiếu tiền mặt** đúng thời điểm. Rủi ro thường là *timing*, không phải tổng chi phí.\ne:T885,---\ntitle: \"Lập và quản lý dòng tiền dự án (Cash flow)\"\ndepartment: \"finance\"\nsummary: \"Cách dự báo và kiểm soát dòng tiền dự án để không bị đứt vốn khi chi phí chi ra sớm hơn tiền nghiệm thu thu về.\"\ntags: [\"dòng tiền\", \"cash flow\", \"tài chính\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng Tài chính - Kế toán\"\nupdated: \"2026-08-05\"\nreadingTime: \"7 phút\"\nfeatured: true\n---\n\n## Mục tiêu\n\nĐảm bảo dự án **luôn đủ tiền chi trả** cho nhân công, vật tư và thầu phụ — kiểm soát *thời điểm* thu/chi chứ không chỉ tổng số.\n\n## Vì sao quan trọng\n\nTrong xây dựng, chi phí thường **chi ra trước** (tạm ứng, mua vật tư) nhưng giá trị nghiệm thu **thu về sau**. Chênh lệch thời điểm này gây thiếu hụt vốn lưu động, buộc phải giãn tiến độ.\n\n## Các bước lập dự báo dòng tiền\n\n1. **Gắn dòng tiền với tiến độ** — phân bổ chi phí theo tuần/tháng dựa trên kế hoạch thi công.\n2. **Lập dòng tiền vào** — theo mốc nghiệm thu và thời hạn thanh toán trong hợp đồng, trừ phần giữ lại (retention).\n3. **Lập dòng tiền ra** — lương, vật tư, thầu phụ, máy móc, chi phí chung.\n4. **Tính dòng tiền ròng lũy kế** — phát hiện các thời điểm âm.\n5. **Lập phương án bù** — tạm ứng, tín dụng, đàm phán mốc thanh toán.\n\n## Bảng dòng tiền mẫu\n\n| Chỉ tiêu | T1 | T2 | T3 |\n| --- | --- | --- | --- |\n| Tiền vào | 0 | 800 | 1.200 |\n| Tiền ra | 600 | 900 | 1.000 |\n| Ròng trong kỳ | -600 | -100 | 200 |\n| Lũy kế | -600 | -700 | -500 |\n\n## Checklist kiểm soát\n\n- [ ] Cập nhật dự báo hàng tháng theo tiến độ thực tế\n- [ ] Theo dõi công nợ phải thu và phần giữ lại\n- [ ] Cảnh báo sớm các kỳ dòng tiền âm\n- [ ] Gắn kế hoạch thanh toán thầu phụ với dòng tiền vào\n\n\u003e **Lưu ý:** Nhiều dự án \"có lãi trên giấy\" vẫn chết vì **thiếu tiền mặt** đúng thời điểm. Rủi ro thường là *timing*, không phải tổng chi phí.\nf:T728,\n## Mục tiêu\n\nPhát hiện **vượt chi sớm** để còn kịp xử lý, thay vì biết khi đã quá muộn.\n\n## Ba con số cần theo dõi cho mỗi hạng mục\n\n| Con số | Ý nghĩa |\n| --- | --- |\n| Chi phí đã phát sinh | Đã thực chi tới thời điểm |\n| Chi phí đã cam kết | Hợp đồng/PO đã ký nhưng chưa chi |\n| Chi phí để hoàn thành (CTC) | Ước tính phần còn lại phải chi |\n\nDự báo tổng chi = đã phát sinh + để hoàn thành. So với **dự toán được duyệt** để biết đang lãi hay lỗ.\n\n## Chu kỳ kiểm soát\n\n1. Dùng **hệ thống mã chi phí** thống nhất (cost code / CBS).\n2. **Rà soát định kỳ** — tối thiểu hàng tháng, dự án lớn nên 2 tuần/lần, phối hợp giữa chỉ huy công trường và tài chính.\n3. **Cập nhật CTC** mỗi kỳ — báo cáo dựa trên CTC cũ 6 tuần chỉ là tài liệu lịch sử, không còn giá trị kiểm soát.\n4. **Cảnh báo theo ngưỡng** — chênh lệch vượt **5-10%** của hạng mục phải có hành động khắc phục.\n\n## Chỉ số hiệu quả chi phí (tham khảo)\n\n- **CPI = Giá trị thu được / Chi phí thực tế.** CPI \u003c 1 nghĩa là đang vượt chi so với khối lượng hoàn thành.\n- CPI tại mốc ~20% khối lượng thường dự báo khá tốt CPI khi kết thúc → theo dõi sớm rất quan trọng.\n\n## Checklist\n\n- [ ] Mọi chi phí gắn đúng mã\n- [ ] Cập nhật CTC mỗi kỳ báo cáo\n- [ ] So sánh dự toán − cam kết − thực tế − CTC\n- [ ] Cảnh báo và xử lý khi vượt ngưỡng\n\n\u003e **Lưu ý:** Báo cáo \"đang trong ngân sách\" vẫn có thể che giấu **bào mòn lợi nhuận** nếu CTC lạc quan quá mức. Hãy theo dõi *xu hướng* CTC qua các kỳ.\n10:T90b,---\ntitle: \"Kiểm soát chi phí: dự toán và thực tế (Budget vs Actual)\"\ndepartment: \"cost-control\"\nsummary: \"Cách thiết lập chu kỳ so sánh dự toán với chi phí thực tế, dùng cost-to-complete và ngưỡng cảnh báo để phát hiện vượt chi sớm.\"\ntags: [\"kiểm soát chi phí\", \"budget vs actual\", \"cost to complete\"]\ndifficulty: \"Nâng cao\"\nauthor: \"Phòng Kiểm soát chi phí\"\nupdated: \"2026-08-05\"\nreadingTime: \"8 phút\"\nfeatured: true\n---\n\n## Mục tiêu\n\nPhát hiện **vượt chi sớm** để còn kịp xử lý, thay vì biết khi đã quá muộn.\n\n## Ba con số cần theo dõi cho mỗi hạng mục\n\n| Con số | Ý nghĩa |\n| --- | --- |\n| Chi phí đã phát sinh | Đã thực chi tới thời điểm |\n| Chi phí đã cam kết | Hợp đồng/PO đã ký nhưng chưa chi |\n| Chi phí để hoàn thành (CTC) | Ước tính phần còn lại phải chi |\n\nDự báo tổng chi = đã phát sinh + để hoàn thành. So với **dự toán được duyệt** để biết đang lãi hay lỗ.\n\n## Chu kỳ kiểm soát\n\n1. Dùng **hệ thống mã chi phí** thống nhất (cost code / CBS).\n2. **Rà soát định kỳ** — tối thiểu hàng tháng, dự án lớn nên 2 tuần/lần, phối hợp giữa chỉ huy công trường và tài chính.\n3. **Cập nhật CTC** mỗi kỳ — báo cáo dựa trên CTC cũ 6 tuần chỉ là tài liệu lịch sử, không còn giá trị kiểm soát.\n4. **Cảnh báo theo ngưỡng** — chênh lệch vượt **5-10%** của hạng mục phải có hành động khắc phục.\n\n## Chỉ số hiệu quả chi phí (tham khảo)\n\n- **CPI = Giá trị thu được / Chi phí thực tế.** CPI \u003c 1 nghĩa là đang vượt chi so với khối lượng hoàn thành.\n- CPI tại mốc ~20% khối lượng thường dự báo khá tốt CPI khi kết thúc → theo dõi sớm rất quan trọng.\n\n## Checklist\n\n- [ ] Mọi chi phí gắn đúng mã\n- [ ] Cập nhật CTC mỗi kỳ báo cáo\n- [ ] So sánh dự toán − cam kết − thực tế − CTC\n- [ ] Cảnh báo và xử lý khi vượt ngưỡng\n\n\u003e **Lưu ý:** Báo cáo \"đang trong ngân sách\" vẫn có thể che giấu **bào mòn lợi nhuận** nếu CTC lạc quan quá mức. Hãy theo dõi *xu hướng* CTC qua các kỳ.\n11:T746,\n## Mục tiêu\n\nTrả lời câu hỏi: **dự án có tạo ra giá trị không** — dựa trên dòng tiền tăng thêm và giá trị thời gian của tiền.\n\n## Các bước thẩm định\n\n1. **Xác định dòng tiền tăng thêm** — chỉ tính dòng tiền do dự án tạo ra, sau thuế.\n2. **Chọn thời gian phân tích** và **suất chiết khấu** phản ánh rủi ro dự án.\n3. **Áp dụng các chỉ tiêu** đánh giá.\n4. **Phân tích độ nhạy** — kịch bản tốt/xấu.\n5. **Ra quyết định** — chấp nhận / từ chối / hoãn / điều chỉnh.\n\n## Các chỉ tiêu chính\n\n| Chỉ tiêu | Ý nghĩa | Quy tắc chấp nhận |\n| --- | --- | --- |\n| NPV | Giá trị hiện tại ròng | NPV \u003e 0 → chấp nhận |\n| IRR | Suất sinh lời nội tại | IRR \u003e suất yêu cầu → chấp nhận |\n| Thời gian hoàn vốn | Thời gian thu hồi vốn | ≤ ngưỡng công ty |\n| Chỉ số sinh lời (PI) | PV dòng tiền / vốn đầu tư | Dùng khi vốn hạn chế |\n\n## Lưu ý khi ra quyết định\n\n- **NPV là thước đo chuẩn** cho việc tạo giá trị; khi các chỉ tiêu mâu thuẫn (nhất là dự án loại trừ nhau), ưu tiên NPV.\n- IRR dễ truyền đạt nhưng có thể gây hiểu nhầm với dòng tiền bất thường.\n- Kết quả chỉ tốt bằng **chất lượng giả định đầu vào** — phải phản biện dự báo.\n\n## Checklist\n\n- [ ] Dòng tiền tăng thêm, sau thuế, đúng kỳ\n- [ ] Suất chiết khấu phản ánh rủi ro\n- [ ] Tính NPV, IRR, hoàn vốn, PI\n- [ ] Phân tích độ nhạy với giả định chính\n\n\u003e **Lưu ý:** NPV \u003e 0 chỉ nên chấp nhận khi giả định, năng lực thực hiện, thuế và yếu tố chiến lược đều hợp lý — con số không thay thế được phán đoán.\n12:T8e4,---\ntitle: \"Thẩm định hiệu quả dự án đầu tư (NPV/IRR)\"\ndepartment: \"investment\"\nsummary: \"Cách đánh giá hiệu quả tài chính dự án bằng NPV, IRR, thời gian hoàn vốn và chỉ số sinh lời để ra quyết định đầu tư.\"\ntags: [\"đầu tư\", \"npv\", \"irr\"]\ndifficulty: \"Nâng cao\"\nauthor: \"Phòng Đầu tư\"\nupdated: \"2026-08-04\"\nreadingTime: \"8 phút\"\nfeatured: true\n---\n\n## Mục tiêu\n\nTrả lời câu hỏi: **dự án có tạo ra giá trị không** — dựa trên dòng tiền tăng thêm và giá trị thời gian của tiền.\n\n## Các bước thẩm định\n\n1. **Xác định dòng tiền tăng thêm** — chỉ tính dòng tiền do dự án tạo ra, sau thuế.\n2. **Chọn thời gian phân tích** và **suất chiết khấu** phản ánh rủi ro dự án.\n3. **Áp dụng các chỉ tiêu** đánh giá.\n4. **Phân tích độ nhạy** — kịch bản tốt/xấu.\n5. **Ra quyết định** — chấp nhận / từ chối / hoãn / điều chỉnh.\n\n## Các chỉ tiêu chính\n\n| Chỉ tiêu | Ý nghĩa | Quy tắc chấp nhận |\n| --- | --- | --- |\n| NPV | Giá trị hiện tại ròng | NPV \u003e 0 → chấp nhận |\n| IRR | Suất sinh lời nội tại | IRR \u003e suất yêu cầu → chấp nhận |\n| Thời gian hoàn vốn | Thời gian thu hồi vốn | ≤ ngưỡng công ty |\n| Chỉ số sinh lời (PI) | PV dòng tiền / vốn đầu tư | Dùng khi vốn hạn chế |\n\n## Lưu ý khi ra quyết định\n\n- **NPV là thước đo chuẩn** cho việc tạo giá trị; khi các chỉ tiêu mâu thuẫn (nhất là dự án loại trừ nhau), ưu tiên NPV.\n- IRR dễ truyền đạt nhưng có thể gây hiểu nhầm với dòng tiền bất thường.\n- Kết quả chỉ tốt bằng **chất lượng giả định đầu vào** — phải phản biện dự báo.\n\n## Checklist\n\n- [ ] Dòng tiền tăng thêm, sau thuế, đúng kỳ\n- [ ] Suất chiết khấu phản ánh rủi ro\n- [ ] Tính NPV, IRR, hoàn vốn, PI\n- [ ] Phân tích độ nhạy với giả định chính\n\n\u003e **Lưu ý:** NPV \u003e 0 chỉ nên chấp nhận khi giả định, năng lực thực hiện, thuế và yếu tố chiến lược đều hợp lý — con số không thay thế được phán đoán.\n13:T654,\n## Mục tiêu\n\nPhát hiện và xử lý **rủi ro pháp lý** trong hợp đồng trước khi ký, tránh tranh chấp và thiệt hại về sau.\n\n## Các điều khoản trọng yếu cần rà soát\n\n1. **Chủ thể \u0026 thẩm quyền ký** — đúng pháp nhân, người ký có ủy quyền hợp lệ.\n2. **Phạm vi công việc** — mô tả rõ ràng, tránh hiểu nhầm.\n3. **Giá trị \u0026 thanh toán** — đơn giá, mốc thanh toán, tạm ứng, giữ lại (retention).\n4. **Tiến độ \u0026 phạt** — thời hạn, phạt chậm, mức trần bồi thường.\n5. **Thay đổi khối lượng** — cơ chế xử lý phát sinh (variation).\n6. **Bảo hành \u0026 bảo đảm** — thời hạn, phạm vi, bảo lãnh.\n7. **Bất khả kháng** — định nghĩa và hậu quả.\n8. **Chấm dứt \u0026 giải quyết tranh chấp** — điều kiện, cơ quan tài phán.\n\n## Checklist rà soát\n\n- [ ] Thông tin pháp nhân và thẩm quyền ký đúng\n- [ ] Nghĩa vụ hai bên rõ ràng, cân bằng\n- [ ] Điều khoản thanh toán và phạt hợp lý\n- [ ] Cơ chế xử lý phát sinh và bất khả kháng\n- [ ] Điều khoản giải quyết tranh chấp rõ ràng\n\n## Ma trận rủi ro nhanh\n\n| Mức rủi ro | Xử lý |\n| --- | --- |\n| Cao | Bắt buộc đàm phán sửa trước khi ký |\n| Trung bình | Ghi nhận, có phương án kiểm soát |\n| Thấp | Chấp nhận, theo dõi |\n\n\u003e **Lưu ý:** Điều khoản mập mờ về **phạm vi công việc và xử lý phát sinh** là nguồn tranh chấp phổ biến nhất — cần làm rõ ngay từ khâu ký.\n14:T7e5,---\ntitle: \"Rà soát hợp đồng trước khi ký\"\ndepartment: \"legal\"\nsummary: \"Checklist pháp lý các điều khoản trọng yếu cần kiểm tra trước khi ký hợp đồng để phòng ngừa rủi ro và tranh chấp.\"\ntags: [\"hợp đồng\", \"pháp lý\", \"rủi ro\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng Pháp lý\"\nupdated: \"2026-08-04\"\nreadingTime: \"7 phút\"\nfeatured: true\n---\n\n## Mục tiêu\n\nPhát hiện và xử lý **rủi ro pháp lý** trong hợp đồng trước khi ký, tránh tranh chấp và thiệt hại về sau.\n\n## Các điều khoản trọng yếu cần rà soát\n\n1. **Chủ thể \u0026 thẩm quyền ký** — đúng pháp nhân, người ký có ủy quyền hợp lệ.\n2. **Phạm vi công việc** — mô tả rõ ràng, tránh hiểu nhầm.\n3. **Giá trị \u0026 thanh toán** — đơn giá, mốc thanh toán, tạm ứng, giữ lại (retention).\n4. **Tiến độ \u0026 phạt** — thời hạn, phạt chậm, mức trần bồi thường.\n5. **Thay đổi khối lượng** — cơ chế xử lý phát sinh (variation).\n6. **Bảo hành \u0026 bảo đảm** — thời hạn, phạm vi, bảo lãnh.\n7. **Bất khả kháng** — định nghĩa và hậu quả.\n8. **Chấm dứt \u0026 giải quyết tranh chấp** — điều kiện, cơ quan tài phán.\n\n## Checklist rà soát\n\n- [ ] Thông tin pháp nhân và thẩm quyền ký đúng\n- [ ] Nghĩa vụ hai bên rõ ràng, cân bằng\n- [ ] Điều khoản thanh toán và phạt hợp lý\n- [ ] Cơ chế xử lý phát sinh và bất khả kháng\n- [ ] Điều khoản giải quyết tranh chấp rõ ràng\n\n## Ma trận rủi ro nhanh\n\n| Mức rủi ro | Xử lý |\n| --- | --- |\n| Cao | Bắt buộc đàm phán sửa trước khi ký |\n| Trung bình | Ghi nhận, có phương án kiểm soát |\n| Thấp | Chấp nhận, theo dõi |\n\n\u003e **Lưu ý:** Điều khoản mập mờ về **phạm vi công việc và xử lý phát sinh** là nguồn tranh chấp phổ biến nhất — cần làm rõ ngay từ khâu ký.\n15:T60b,---\ntitle: \"Nghiệm thu cốt thép trước khi đổ bê tông\"\ndepartment: \"construction-tech\"\nsummary: \"Checklist kiểm tra công tác cốt thép, cốp pha và vệ sinh trước khi cho phép đổ bê tông.\"\ntags: [\"cốt thép\", \"nghiệm thu\", \"bê tông\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng Kỹ thuật thi công\"\nupdated: \"2026-08-04\"\nreadingTime: \"6 phút\"\nfeatured: true\n---\n\n## Mục tiêu\n\nĐảm bảo cốt thép **đúng thiết kế** và đủ điều kiện trước khi đổ bê tông — đây là điểm dừng bắt buộc (hold point).\n\n## Kiểm tra cốt thép\n\n- [ ] Đúng đường kính, số lượng, khoảng cách theo bản vẽ\n- [ ] Chiều dài neo, nối chồng đạt yêu cầu\n- [ ] Buộc chắc chắn, không xê dịch khi đổ\n- [ ] Con kê bảo đảm chiều dày lớp bảo vệ\n\n## Kiểm tra cốp pha \u0026 chi tiết chờ\n\n- [ ] Cốp pha kín khít, chống đỡ ổn định\n- [ ] Kích thước hình học, cao độ, tim trục đúng\n- [ ] Chi tiết chờ (ống, giằng, bu lông) đúng vị trí\n- [ ] Vệ sinh sạch trong cốp pha, tưới ẩm nếu cần\n\n## Trình tự nghiệm thu\n\n1. Nhà thầu tự kiểm tra và mời nghiệm thu.\n2. Kỹ thuật + QA/QC + TVGS kiểm tra hiện trường.\n3. Ký biên bản nghiệm thu cốt thép **trước khi** đổ.\n4. Chỉ đổ bê tông sau khi biên bản được ký.\n\n\u003e **Cảnh báo:** Tuyệt đối không đổ bê tông khi chưa có biên bản nghiệm thu cốt thép được ký duyệt.\n16:T66b,---\ntitle: \"Họp giao ban công trường hàng ngày\"\ndepartment: \"site-management\"\nsummary: \"Cách tổ chức buổi giao ban đầu ngày ngắn gọn để thống nhất công việc, an toàn và tiến độ giữa các tổ đội.\"\ntags: [\"giao ban\", \"điều hành\", \"tiến độ\"]\ndifficulty: \"Cơ bản\"\nauthor: \"Ban chỉ huy công trường\"\nupdated: \"2026-08-04\"\nreadingTime: \"5 phút\"\nfeatured: true\n---\n\n## Mục tiêu\n\nĐảm bảo mọi tổ đội **bắt đầu ngày làm việc** với công việc rõ ràng, nhận diện rủi ro an toàn và bám sát tiến độ.\n\n## Thời điểm \u0026 thành phần\n\n- **Thời gian:** 10-15 phút, đầu mỗi ca làm việc.\n- **Thành phần:** chỉ huy trưởng/phó, giám sát, tổ trưởng các tổ đội, cán bộ an toàn.\n\n## Nội dung cần thống nhất\n\n1. **Công việc hôm nay** — hạng mục, vị trí, khối lượng mục tiêu.\n2. **Nhân lực \u0026 thiết bị** — bố trí tổ đội, máy móc, cẩu tháp.\n3. **An toàn** — cảnh báo rủi ro của công việc trong ngày.\n4. **Vướng mắc** — thiếu vật tư, chờ bản vẽ, thời tiết.\n5. **Tiến độ** — so với kế hoạch tuần, việc cần bù.\n\n## Checklist điều hành\n\n- [ ] Điểm danh tổ đội và thiết bị\n- [ ] Giao việc rõ vị trí + khối lượng\n- [ ] Nhắc nhở an toàn theo công việc\n- [ ] Ghi nhận vướng mắc \u0026 người xử lý\n- [ ] Chốt mốc kiểm tra trong ngày\n\n\u003e **Mẹo:** Giữ buổi giao ban đứng, ngắn gọn. Vấn đề lớn tách ra họp riêng, tránh kéo dài làm chậm ra quân.\n17:T5ee,---\ntitle: \"An toàn khi làm việc trên cao\"\ndepartment: \"hse\"\nsummary: \"Yêu cầu bắt buộc và checklist kiểm tra trước khi cho phép công nhân làm việc trên cao để chống ngã.\"\ntags: [\"an toàn\", \"làm việc trên cao\", \"hse\"]\ndifficulty: \"Cơ bản\"\nauthor: \"Phòng An toàn (HSE)\"\nupdated: \"2026-08-04\"\nreadingTime: \"5 phút\"\nfeatured: true\n---\n\n## Mục tiêu\n\nNgăn ngừa tai nạn **ngã cao** — nhóm tai nạn nghiêm trọng và phổ biến nhất tại công trường.\n\n## Áp dụng khi\n\nLàm việc ở độ cao từ **2 mét** trở lên, hoặc nơi có nguy cơ rơi ngã.\n\n## Yêu cầu bắt buộc\n\n- [ ] Dây an toàn toàn thân + móc kép, neo vào điểm chắc chắn\n- [ ] Giàn giáo được nghiệm thu, có thẻ (thẻ xanh) còn hiệu lực\n- [ ] Sàn thao tác đủ rộng, có lan can và chắn chân\n- [ ] Che chắn/ rào chắn khu vực bên dưới\n- [ ] Công nhân đủ sức khỏe, đã huấn luyện an toàn\n\n## Trước khi bắt đầu\n\n1. Kiểm tra thời tiết (gió lớn, mưa, giông → tạm dừng).\n2. Kiểm tra tình trạng dây, móc, giàn giáo.\n3. Xác định điểm neo và lối thoát.\n4. Phổ biến rủi ro cho tổ đội.\n\n## Nguyên tắc 100% neo móc\n\nLuôn có **ít nhất một móc được neo** trong suốt quá trình di chuyển và làm việc trên cao.\n\n\u003e **Cảnh báo:** Không có điểm neo an toàn thì không làm việc trên cao. Dừng công việc và báo cán bộ an toàn.\n18:T621,\n## Mục tiêu\n\nQuyết định **có tham gia thầu hay không** một cách có hệ thống — bảo vệ tỷ lệ thắng và nguồn lực lập dự toán khỏi những gói không phù hợp.\n\n## 5 nhóm tiêu chí (có trọng số)\n\n| Nhóm tiêu chí | Trọng số gợi ý |\n| --- | --- |\n| Chủ đầu tư \u0026 khả năng thanh toán | 25% |\n| Mức độ phù hợp của gói (quy mô, loại hình) | 20% |\n| Năng lực \u0026 nguồn lực (nhân sự, tài chính, bảo lãnh) | 20% |\n| Vị thế cạnh tranh \u0026 xác suất thắng | 20% |\n| Phù hợp chiến lược | 15% |\n\n## Cách chấm điểm\n\n1. Chấm mỗi tiêu chí thang **1-5** (1 = kém/không rõ, 5 = rất tốt).\n2. Nhân với trọng số → điểm có trọng số.\n3. Cộng lại thành điểm tổng.\n\n## Ngưỡng quyết định (tham khảo)\n\n| Điểm tổng | Quyết định |\n| --- | --- |\n| ≥ 3,5 | Tham gia (dồn nguồn lực lập hồ sơ) |\n| 2,5 - 3,4 | Cân nhắc — lãnh đạo xem tiêu chí yếu |\n| \u003c 2,5 | Không tham gia |\n\n## Lưu ý vận hành\n\n- Chấm trong **24-48 giờ** sau khi nhận hồ sơ mời thầu, **trước khi** mời thầu phụ báo giá.\n- Ghi lại lý do dù quyết định thế nào.\n- Đặt **red flag**: một số rủi ro đơn lẻ (chủ đầu tư nợ xấu, điều khoản bất lợi nặng) có thể loại thẳng.\n\n\u003e **Mẹo:** Việc chấm điểm 20-30 phút/gói giúp nhiều nhà thầu loại bỏ tới ~1/3 số gói không đáng theo, dồn sức cho gói dễ thắng và có lãi.\n19:T7cf,---\ntitle: \"Ra quyết định tham gia thầu (Bid / No-bid)\"\ndepartment: \"estimating\"\nsummary: \"Khung chấm điểm có trọng số giúp quyết định có nên bỏ công sức dự thầu hay không, trước khi dồn nguồn lực lập hồ sơ.\"\ntags: [\"dự thầu\", \"bid no-bid\", \"đấu thầu\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng Dự toán - Đấu thầu\"\nupdated: \"2026-08-03\"\nreadingTime: \"6 phút\"\n---\n\n## Mục tiêu\n\nQuyết định **có tham gia thầu hay không** một cách có hệ thống — bảo vệ tỷ lệ thắng và nguồn lực lập dự toán khỏi những gói không phù hợp.\n\n## 5 nhóm tiêu chí (có trọng số)\n\n| Nhóm tiêu chí | Trọng số gợi ý |\n| --- | --- |\n| Chủ đầu tư \u0026 khả năng thanh toán | 25% |\n| Mức độ phù hợp của gói (quy mô, loại hình) | 20% |\n| Năng lực \u0026 nguồn lực (nhân sự, tài chính, bảo lãnh) | 20% |\n| Vị thế cạnh tranh \u0026 xác suất thắng | 20% |\n| Phù hợp chiến lược | 15% |\n\n## Cách chấm điểm\n\n1. Chấm mỗi tiêu chí thang **1-5** (1 = kém/không rõ, 5 = rất tốt).\n2. Nhân với trọng số → điểm có trọng số.\n3. Cộng lại thành điểm tổng.\n\n## Ngưỡng quyết định (tham khảo)\n\n| Điểm tổng | Quyết định |\n| --- | --- |\n| ≥ 3,5 | Tham gia (dồn nguồn lực lập hồ sơ) |\n| 2,5 - 3,4 | Cân nhắc — lãnh đạo xem tiêu chí yếu |\n| \u003c 2,5 | Không tham gia |\n\n## Lưu ý vận hành\n\n- Chấm trong **24-48 giờ** sau khi nhận hồ sơ mời thầu, **trước khi** mời thầu phụ báo giá.\n- Ghi lại lý do dù quyết định thế nào.\n- Đặt **red flag**: một số rủi ro đơn lẻ (chủ đầu tư nợ xấu, điều khoản bất lợi nặng) có thể loại thẳng.\n\n\u003e **Mẹo:** Việc chấm điểm 20-30 phút/gói giúp nhiều nhà thầu loại bỏ tới ~1/3 số gói không đáng theo, dồn sức cho gói dễ thắng và có lãi.\n1a:T5f7,\n## Mục tiêu\n\nVận hành hợp đồng **đúng cam kết**, thanh toán đúng hạn và giữ đầy đủ hồ sơ để bảo vệ quyền lợi khi có tranh chấp.\n\n## Việc quản lý hợp đồng bao gồm\n\n- Phát hành và phản hồi **thông báo (notice)** theo hợp đồng.\n- Theo dõi **nghĩa vụ tiến độ** và các mốc.\n- Quản lý **thay đổi (variation)** và quy trình thanh toán.\n- Lưu trữ **hồ sơ đồng thời (contemporaneous records)**.\n\n## Theo dõi mốc thanh toán\n\n| Mốc | Điều kiện | Giá trị | Giữ lại |\n| --- | --- | --- | --- |\n| Tạm ứng | Sau ký HĐ + bảo lãnh | 10-15% | — |\n| Theo giai đoạn | Nghiệm thu khối lượng | Theo IPC | 5-10% |\n| Quyết toán | Hoàn thành + bảo hành | Còn lại | Hoàn giữ lại |\n\n## Hồ sơ cần lưu (rất quan trọng)\n\n- Nhật ký công trường, biên bản họp, hình ảnh.\n- Công văn, chỉ thị, thông báo và phản hồi.\n- Biên bản nghiệm thu, hồ sơ thanh toán (IPC).\n- Cập nhật tiến độ đáng tin cậy.\n\n## Checklist\n\n- [ ] Đọc kỹ hợp đồng, nắm rõ nghĩa vụ và mốc\n- [ ] Theo dõi bảo lãnh/bảo hiểm còn hiệu lực\n- [ ] Phát hành thông báo đúng thời hạn và đúng mẫu\n- [ ] Lưu hồ sơ đồng thời, có hệ thống\n\n\u003e **Lưu ý:** Quản trị hợp đồng tốt là **khung vận hành** biến các sự kiện thành xử lý có kiểm soát — thay vì để chúng trở thành tranh chấp.\n1b:T7b5,---\ntitle: \"Quản lý hợp đồng thi công và mốc thanh toán\"\ndepartment: \"contracts\"\nsummary: \"Cách vận hành hợp đồng thi công: theo dõi nghĩa vụ, mốc thanh toán, bảo lãnh, giữ lại và hồ sơ để bảo vệ quyền lợi.\"\ntags: [\"hợp đồng\", \"thanh toán\", \"quản trị hợp đồng\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng Quản lý hợp đồng\"\nupdated: \"2026-08-03\"\nreadingTime: \"7 phút\"\n---\n\n## Mục tiêu\n\nVận hành hợp đồng **đúng cam kết**, thanh toán đúng hạn và giữ đầy đủ hồ sơ để bảo vệ quyền lợi khi có tranh chấp.\n\n## Việc quản lý hợp đồng bao gồm\n\n- Phát hành và phản hồi **thông báo (notice)** theo hợp đồng.\n- Theo dõi **nghĩa vụ tiến độ** và các mốc.\n- Quản lý **thay đổi (variation)** và quy trình thanh toán.\n- Lưu trữ **hồ sơ đồng thời (contemporaneous records)**.\n\n## Theo dõi mốc thanh toán\n\n| Mốc | Điều kiện | Giá trị | Giữ lại |\n| --- | --- | --- | --- |\n| Tạm ứng | Sau ký HĐ + bảo lãnh | 10-15% | — |\n| Theo giai đoạn | Nghiệm thu khối lượng | Theo IPC | 5-10% |\n| Quyết toán | Hoàn thành + bảo hành | Còn lại | Hoàn giữ lại |\n\n## Hồ sơ cần lưu (rất quan trọng)\n\n- Nhật ký công trường, biên bản họp, hình ảnh.\n- Công văn, chỉ thị, thông báo và phản hồi.\n- Biên bản nghiệm thu, hồ sơ thanh toán (IPC).\n- Cập nhật tiến độ đáng tin cậy.\n\n## Checklist\n\n- [ ] Đọc kỹ hợp đồng, nắm rõ nghĩa vụ và mốc\n- [ ] Theo dõi bảo lãnh/bảo hiểm còn hiệu lực\n- [ ] Phát hành thông báo đúng thời hạn và đúng mẫu\n- [ ] Lưu hồ sơ đồng thời, có hệ thống\n\n\u003e **Lưu ý:** Quản trị hợp đồng tốt là **khung vận hành** biến các sự kiện thành xử lý có kiểm soát — thay vì để chúng trở thành tranh chấp.\n1c:T68e,---\ntitle: \"Lập và kiểm soát tiến độ thi công\"\ndepartment: \"site-management\"\nsummary: \"Cách lập tiến độ thi công, bám sát thực tế và xử lý khi chậm tiến độ so với kế hoạch.\"\ntags: [\"tiến độ\", \"kế hoạch\", \"quản lý dự án\"]\ndifficulty: \"Trung bình\"\nauthor: \"Ban chỉ huy công trường\"\nupdated: \"2026-08-03\"\nreadingTime: \"7 phút\"\n---\n\n## Mục tiêu\n\nGiữ dự án **đúng tiến độ**, phát hiện sớm nguy cơ chậm và có biện pháp bù kịp thời.\n\n## Các bước lập tiến độ\n\n1. **Chia hạng mục** — bóc công việc theo WBS (móng, thân, hoàn thiện, MEP...).\n2. **Xác định thời lượng** — dựa trên khối lượng và định mức năng suất.\n3. **Xác định trình tự \u0026 ràng buộc** — công việc trước/sau, đường găng (critical path).\n4. **Phân bổ nguồn lực** — nhân công, thiết bị, vật tư theo tuần.\n5. **Lập mốc kiểm soát** — các milestone quan trọng.\n\n## Kiểm soát hàng tuần\n\n| Chỉ số | Ý nghĩa |\n| --- | --- |\n| % kế hoạch | Khối lượng dự kiến đến thời điểm |\n| % thực tế | Khối lượng đã hoàn thành |\n| Chênh lệch | Thực tế − kế hoạch (âm = chậm) |\n\n## Khi bị chậm tiến độ\n\n- Xác định nguyên nhân gốc (vật tư, thời tiết, nhân lực, bản vẽ).\n- Ưu tiên **các công việc trên đường găng**.\n- Cân nhắc tăng ca, tăng tổ đội, hoặc thi công song song.\n\n\u003e **Lưu ý:** Chậm một công việc trên đường găng sẽ làm chậm cả dự án — hãy theo dõi đường găng sát sao nhất.\n1d:T66e,---\ntitle: \"Quy trình tuyển dụng và phỏng vấn\"\ndepartment: \"hr\"\nsummary: \"Chuẩn hóa các bước từ mô tả công việc, sàng lọc, phỏng vấn đến ra quyết định tuyển dụng công bằng và hiệu quả.\"\ntags: [\"tuyển dụng\", \"phỏng vấn\", \"nhân sự\"]\ndifficulty: \"Cơ bản\"\nauthor: \"Phòng Nhân sự\"\nupdated: \"2026-08-02\"\nreadingTime: \"6 phút\"\n---\n\n## Mục tiêu\n\nTuyển đúng người, đúng việc — dựa trên **tiêu chí rõ ràng**, giảm cảm tính và thiên kiến.\n\n## Quy trình\n\n1. **Mô tả công việc (JD)** — nhiệm vụ, yêu cầu, tiêu chí đánh giá.\n2. **Đăng tuyển \u0026 tìm nguồn** — kênh phù hợp với vị trí.\n3. **Sàng lọc hồ sơ** — theo tiêu chí bắt buộc và ưu tiên.\n4. **Phỏng vấn** — cấu trúc thống nhất, chấm theo thang điểm.\n5. **Kiểm tra tham chiếu** — với vị trí quan trọng.\n6. **Đề nghị \u0026 thương lượng** — lương, thời gian nhận việc.\n\n## Phỏng vấn theo cấu trúc\n\n- Dùng **bộ câu hỏi chung** cho mọi ứng viên cùng vị trí.\n- Hỏi theo **tình huống thực tế** (STAR: Situation - Task - Action - Result).\n- Chấm điểm theo tiêu chí, ghi nhận bằng chứng.\n\n## Checklist\n\n- [ ] JD rõ nhiệm vụ và tiêu chí\n- [ ] Bộ câu hỏi phỏng vấn thống nhất\n- [ ] Thang điểm đánh giá khách quan\n- [ ] Phản hồi cho ứng viên đúng hẹn\n\n\u003e **Mẹo:** Phỏng vấn có cấu trúc và chấm điểm theo tiêu chí dự báo hiệu quả công việc tốt hơn nhiều so với phỏng vấn cảm tính, tự do.\n1e:T591,\n## Mục tiêu\n\nNhìn rõ **cơ hội đang ở đâu** trong phễu bán hàng và **dự báo doanh số** đáng tin để phân bổ nguồn lực.\n\n## Các giai đoạn pipeline (ví dụ)\n\n1. **Tiềm năng (Lead)** — mới tiếp cận.\n2. **Đủ điều kiện (Qualified)** — có nhu cầu, ngân sách, thẩm quyền.\n3. **Đề xuất (Proposal)** — đã gửi báo giá/hồ sơ.\n4. **Đàm phán (Negotiation)** — thương lượng điều khoản.\n5. **Chốt (Won/Lost)** — thắng hoặc thua.\n\n## Dự báo theo xác suất\n\n| Giai đoạn | Xác suất thắng (ví dụ) |\n| --- | --- |\n| Qualified | 20% |\n| Proposal | 50% |\n| Negotiation | 80% |\n\nDoanh số dự báo ≈ Σ (giá trị cơ hội × xác suất giai đoạn).\n\n## Kỷ luật cập nhật\n\n- Mỗi cơ hội có **bước tiếp theo** và **ngày dự kiến chốt**.\n- Rà soát pipeline hàng tuần, loại bỏ cơ hội \"chết\".\n- Cảnh báo cơ hội đứng yên quá lâu ở một giai đoạn.\n\n## Checklist\n\n- [ ] Mọi cơ hội có giai đoạn và giá trị rõ ràng\n- [ ] Có bước tiếp theo + ngày chốt dự kiến\n- [ ] Rà soát pipeline định kỳ hàng tuần\n- [ ] Dự báo dựa trên xác suất, không cảm tính\n\n\u003e **Mẹo:** Pipeline \"phình to\" nhưng toàn cơ hội cũ, không nhúc nhích là dấu hiệu xấu — chất lượng cơ hội quan trọng hơn số lượng.\n1f:T70e,---\ntitle: \"Quản lý pipeline và dự báo doanh số\"\ndepartment: \"sales\"\nsummary: \"Cách xây dựng phễu bán hàng theo giai đoạn, cập nhật cơ hội và dự báo doanh số có căn cứ để ra quyết định.\"\ntags: [\"pipeline\", \"dự báo\", \"bán hàng\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng Kinh doanh\"\nupdated: \"2026-08-02\"\nreadingTime: \"6 phút\"\n---\n\n## Mục tiêu\n\nNhìn rõ **cơ hội đang ở đâu** trong phễu bán hàng và **dự báo doanh số** đáng tin để phân bổ nguồn lực.\n\n## Các giai đoạn pipeline (ví dụ)\n\n1. **Tiềm năng (Lead)** — mới tiếp cận.\n2. **Đủ điều kiện (Qualified)** — có nhu cầu, ngân sách, thẩm quyền.\n3. **Đề xuất (Proposal)** — đã gửi báo giá/hồ sơ.\n4. **Đàm phán (Negotiation)** — thương lượng điều khoản.\n5. **Chốt (Won/Lost)** — thắng hoặc thua.\n\n## Dự báo theo xác suất\n\n| Giai đoạn | Xác suất thắng (ví dụ) |\n| --- | --- |\n| Qualified | 20% |\n| Proposal | 50% |\n| Negotiation | 80% |\n\nDoanh số dự báo ≈ Σ (giá trị cơ hội × xác suất giai đoạn).\n\n## Kỷ luật cập nhật\n\n- Mỗi cơ hội có **bước tiếp theo** và **ngày dự kiến chốt**.\n- Rà soát pipeline hàng tuần, loại bỏ cơ hội \"chết\".\n- Cảnh báo cơ hội đứng yên quá lâu ở một giai đoạn.\n\n## Checklist\n\n- [ ] Mọi cơ hội có giai đoạn và giá trị rõ ràng\n- [ ] Có bước tiếp theo + ngày chốt dự kiến\n- [ ] Rà soát pipeline định kỳ hàng tuần\n- [ ] Dự báo dựa trên xác suất, không cảm tính\n\n\u003e **Mẹo:** Pipeline \"phình to\" nhưng toàn cơ hội cũ, không nhúc nhích là dấu hiệu xấu — chất lượng cơ hội quan trọng hơn số lượng.\n20:T65f,---\ntitle: \"Lập kế hoạch nghiệm thu chất lượng (ITP)\"\ndepartment: \"qaqc\"\nsummary: \"Cách xây dựng Inspection \u0026 Test Plan xác định điểm kiểm tra, điểm dừng và hồ sơ nghiệm thu cho từng công tác.\"\ntags: [\"itp\", \"nghiệm thu\", \"chất lượng\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng QA/QC\"\nupdated: \"2026-08-02\"\nreadingTime: \"6 phút\"\n---\n\n## Mục tiêu\n\nXác định **kiểm tra cái gì, khi nào, ai làm, theo tiêu chuẩn nào** cho từng công tác thi công.\n\n## Thành phần một ITP\n\n1. **Hạng mục công tác** — ví dụ: cốt thép, bê tông, xây, tô.\n2. **Hoạt động kiểm tra/thử nghiệm** — nội dung kiểm tra.\n3. **Tiêu chuẩn tham chiếu** — TCVN / spec dự án.\n4. **Loại điểm kiểm soát** — H (Hold), W (Witness), R (Review).\n5. **Hồ sơ** — biểu mẫu, biên bản, phiếu thí nghiệm.\n6. **Bên tham gia** — nhà thầu, TVGS, chủ đầu tư.\n\n## Phân loại điểm kiểm soát\n\n| Ký hiệu | Ý nghĩa |\n| --- | --- |\n| H (Hold) | Điểm dừng bắt buộc, phải nghiệm thu mới làm tiếp |\n| W (Witness) | Mời chứng kiến, có thể tiếp tục nếu vắng mặt |\n| R (Review) | Xem xét hồ sơ |\n\n## Checklist chất lượng ITP\n\n- [ ] Bao phủ đủ các công tác chính\n- [ ] Gắn đúng tiêu chuẩn và tiêu chí chấp nhận\n- [ ] Xác định rõ điểm H/W/R\n- [ ] Kèm biểu mẫu hồ sơ tương ứng\n\n\u003e **Mẹo:** Đặt điểm Hold ở các công tác bị che khuất sau này (cốt thép, chống thấm) để không phải đục phá kiểm tra về sau.\n21:T663,---\ntitle: \"Lập kế hoạch ngân sách năm\"\ndepartment: \"finance\"\nsummary: \"Quy trình xây dựng ngân sách năm cho công ty/dự án, gắn với mục tiêu kinh doanh và cơ chế theo dõi thực hiện.\"\ntags: [\"ngân sách\", \"kế hoạch\", \"tài chính\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng Tài chính - Kế toán\"\nupdated: \"2026-08-01\"\nreadingTime: \"6 phút\"\n---\n\n## Mục tiêu\n\nChuyển mục tiêu kinh doanh thành **kế hoạch tài chính có thể theo dõi**, làm cơ sở kiểm soát chi tiêu cả năm.\n\n## Các bước\n\n1. **Thu thập giả định** — doanh thu dự kiến, dự án trúng thầu, đơn giá, lạm phát.\n2. **Lập ngân sách doanh thu** — theo dự án và mốc nghiệm thu.\n3. **Lập ngân sách chi phí** — trực tiếp (vật tư, nhân công, máy) và gián tiếp (quản lý, văn phòng).\n4. **Dự phòng** — thường **10-15%** cho biến động giá và rủi ro.\n5. **Trình duyệt** và phân bổ theo quý/tháng.\n\n## Theo dõi thực hiện\n\n| Chỉ số | Ý nghĩa |\n| --- | --- |\n| Ngân sách | Kế hoạch được duyệt |\n| Thực tế | Số phát sinh thực |\n| Chênh lệch | Thực tế − ngân sách |\n| % thực hiện | Thực tế / ngân sách |\n\n## Checklist\n\n- [ ] Giả định rõ ràng, có căn cứ\n- [ ] Có khoản dự phòng hợp lý\n- [ ] Phân bổ theo kỳ để theo dõi\n- [ ] Rà soát chênh lệch định kỳ hàng tháng\n\n\u003e **Mẹo:** Ngân sách chỉ hữu ích khi được **so sánh với thực tế thường xuyên**; lập xong rồi bỏ quên thì chỉ là con số trên giấy.\n22:T654,---\ntitle: \"Bóc tách khối lượng (BOQ) từ bản vẽ\"\ndepartment: \"estimating\"\nsummary: \"Phương pháp bóc khối lượng chính xác từ bản vẽ để lập dự toán và kiểm soát vật tư.\"\ntags: [\"boq\", \"khối lượng\", \"dự toán\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng Dự toán - Đấu thầu\"\nupdated: \"2026-08-01\"\nreadingTime: \"7 phút\"\n---\n\n## Mục tiêu\n\nBóc **đúng và đủ** khối lượng công tác từ bản vẽ làm cơ sở cho dự toán, đấu thầu và kiểm soát vật tư.\n\n## Nguyên tắc bóc tách\n\n1. Bóc theo **trình tự thi công** (móng → thân → hoàn thiện) để không sót.\n2. Mỗi công tác ghi rõ **đơn vị** (m³, m², md, kg, cái).\n3. Bám theo quy tắc đo bóc và định mức áp dụng.\n4. Ghi chú **diễn giải kích thước** để dễ kiểm tra lại.\n\n## Bảng diễn giải mẫu\n\n| Công tác | Diễn giải | Đơn vị | Khối lượng |\n| --- | --- | --- | --- |\n| Bê tông móng | 2 × (3,0 × 2,0 × 0,5) | m³ | 6,0 |\n| Cốt thép móng | Theo bảng thống kê thép | kg | 480 |\n| Ván khuôn móng | Chu vi × chiều cao | m² | 10,0 |\n\n## Kiểm soát chất lượng bóc tách\n\n- [ ] Đối chiếu bản vẽ kiến trúc − kết cấu − MEP\n- [ ] Kiểm tra đơn vị và công thức tính\n- [ ] Rà soát trùng/sót giữa các hạng mục\n- [ ] Cập nhật theo bản vẽ mới nhất (revision)\n\n\u003e **Mẹo:** Luôn lưu công thức diễn giải, đừng chỉ điền con số cuối — khi bản vẽ thay đổi bạn sẽ cập nhật nhanh và dễ soát lỗi.\n23:T66b,\n## Mục tiêu\n\nKiểm soát **mọi thay đổi** so với hợp đồng gốc để không bị \"trôi\" khối lượng và chi phí ngoài kiểm soát.\n\n## Vì sao cần quy trình chặt\n\nChi phí phát sinh là **nguồn bào mòn ngân sách phổ biến nhất** — không phải vì bất ngờ, mà vì chi phí thực đã phát sinh **trước khi** được ghi nhận chính thức vào giá trị hợp đồng.\n\n## Quy trình change control\n\n1. **Ghi nhận sự kiện thay đổi** — mô tả, nguyên nhân, ngày, kèm bằng chứng.\n2. **Đánh giá tác động** — chi phí và tiến độ.\n3. **Định giá \u0026 phân loại trạng thái** — *đề xuất → báo giá → thống nhất → thực hiện*.\n4. **Phê duyệt trước khi làm** — không thi công phát sinh khi chưa được duyệt.\n5. **Cập nhật ngân sách \u0026 hợp đồng** — điều chỉnh giá trị chính thức.\n\n## Nhật ký thay đổi (change log)\n\n| Mã | Mô tả | Chi phí | Tiến độ | Trạng thái |\n| --- | --- | --- | --- | --- |\n| VO-01 | Tăng thép đài móng | +45tr | 0 | Đã duyệt |\n| VO-02 | Đổi vật liệu ốp | +12tr | +2 ngày | Đang báo giá |\n\n## Checklist\n\n- [ ] Mọi phát sinh được ghi vào change log\n- [ ] Đánh giá tác động chi phí + tiến độ\n- [ ] Phê duyệt trước khi thi công\n- [ ] Cập nhật vào giá trị hợp đồng và ngân sách\n\n\u003e **Cảnh báo:** Thi công phát sinh khi chưa được duyệt là rủi ro lớn: dễ bị từ chối thanh toán và tạo tranh chấp. \"Làm trước, tính sau\" thường dẫn tới mất tiền.\n24:T812,---\ntitle: \"Quản lý chi phí phát sinh (Variation Order)\"\ndepartment: \"cost-control\"\nsummary: \"Quy trình kiểm soát thay đổi khối lượng/thiết kế: ghi nhận, định giá và phê duyệt trước khi thi công để tránh 'scope creep'.\"\ntags: [\"phát sinh\", \"variation\", \"change order\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng Kiểm soát chi phí\"\nupdated: \"2026-07-31\"\nreadingTime: \"6 phút\"\n---\n\n## Mục tiêu\n\nKiểm soát **mọi thay đổi** so với hợp đồng gốc để không bị \"trôi\" khối lượng và chi phí ngoài kiểm soát.\n\n## Vì sao cần quy trình chặt\n\nChi phí phát sinh là **nguồn bào mòn ngân sách phổ biến nhất** — không phải vì bất ngờ, mà vì chi phí thực đã phát sinh **trước khi** được ghi nhận chính thức vào giá trị hợp đồng.\n\n## Quy trình change control\n\n1. **Ghi nhận sự kiện thay đổi** — mô tả, nguyên nhân, ngày, kèm bằng chứng.\n2. **Đánh giá tác động** — chi phí và tiến độ.\n3. **Định giá \u0026 phân loại trạng thái** — *đề xuất → báo giá → thống nhất → thực hiện*.\n4. **Phê duyệt trước khi làm** — không thi công phát sinh khi chưa được duyệt.\n5. **Cập nhật ngân sách \u0026 hợp đồng** — điều chỉnh giá trị chính thức.\n\n## Nhật ký thay đổi (change log)\n\n| Mã | Mô tả | Chi phí | Tiến độ | Trạng thái |\n| --- | --- | --- | --- | --- |\n| VO-01 | Tăng thép đài móng | +45tr | 0 | Đã duyệt |\n| VO-02 | Đổi vật liệu ốp | +12tr | +2 ngày | Đang báo giá |\n\n## Checklist\n\n- [ ] Mọi phát sinh được ghi vào change log\n- [ ] Đánh giá tác động chi phí + tiến độ\n- [ ] Phê duyệt trước khi thi công\n- [ ] Cập nhật vào giá trị hợp đồng và ngân sách\n\n\u003e **Cảnh báo:** Thi công phát sinh khi chưa được duyệt là rủi ro lớn: dễ bị từ chối thanh toán và tạo tranh chấp. \"Làm trước, tính sau\" thường dẫn tới mất tiền.\n25:T64d,---\ntitle: \"Quy trình đổ bê tông khối lớn\"\ndepartment: \"construction-tech\"\nsummary: \"Biện pháp thi công và kiểm soát nhiệt cho cấu kiện bê tông khối lớn nhằm tránh nứt do nhiệt.\"\ntags: [\"bê tông\", \"khối lớn\", \"biện pháp thi công\"]\ndifficulty: \"Nâng cao\"\nauthor: \"Phòng Kỹ thuật thi công\"\nupdated: \"2026-07-31\"\nreadingTime: \"8 phút\"\n---\n\n## Mục tiêu\n\nĐổ bê tông khối lớn (đài móng, bè móng...) **liên tục, đạt cường độ** và **kiểm soát chênh lệch nhiệt** để tránh nứt.\n\n## Chuẩn bị trước khi đổ\n\n1. Duyệt cấp phối bê tông (mác, phụ gia, tro bay/xỉ giảm nhiệt).\n2. Lập biện pháp đổ: hướng đổ, chiều dày lớp, thiết bị dự phòng.\n3. Bố trí cảm biến đo nhiệt tại tâm và bề mặt khối đổ.\n4. Chuẩn bị vật liệu bảo dưỡng và giữ nhiệt (bạt, xốp).\n\n## Trong khi đổ\n\n- Đổ theo lớp, đầm kỹ, tránh phân tầng.\n- Đổ **liên tục**, kiểm soát mạch ngừng đúng vị trí thiết kế.\n- Theo dõi độ sụt từng xe, từ chối xe không đạt.\n\n## Kiểm soát nhiệt sau khi đổ\n\n| Tiêu chí | Ngưỡng khuyến nghị |\n| --- | --- |\n| Nhiệt độ tâm khối | ≤ 70 °C |\n| Chênh lệch tâm − bề mặt | ≤ 20 °C |\n\n- Duy trì bảo dưỡng và giữ ẩm liên tục theo quy định.\n- Ghi nhật ký nhiệt cho tới khi an toàn.\n\n\u003e **Lưu ý:** Chênh lệch nhiệt vượt ngưỡng là nguyên nhân chính gây nứt nhiệt — ưu tiên kiểm soát chỉ số này.\n26:T665,\n## Mục tiêu\n\nĐánh giá dự án có **khả thi toàn diện** hay không trước khi cam kết vốn — không chỉ nhìn con số tài chính.\n\n## Các khía cạnh khả thi\n\n1. **Thị trường** — nhu cầu, giá bán/cho thuê, cạnh tranh, hấp thụ.\n2. **Kỹ thuật** — địa điểm, quy hoạch, giải pháp thi công, tiến độ.\n3. **Tài chính** — tổng mức đầu tư, cơ cấu vốn, dòng tiền, NPV/IRR.\n4. **Pháp lý** — quyền sử dụng đất, giấy phép, điều kiện đầu tư.\n5. **Tổ chức** — năng lực triển khai, đối tác.\n\n## Nhận diện \u0026 xử lý rủi ro\n\n| Nhóm rủi ro | Ví dụ | Biện pháp |\n| --- | --- | --- |\n| Thị trường | Bán chậm, giá giảm | Phân kỳ đầu tư, khảo sát kỹ |\n| Chi phí | Vượt tổng mức đầu tư | Dự phòng, hợp đồng trọn gói |\n| Tiến độ | Chậm pháp lý, GPMB | Lập kế hoạch pháp lý sớm |\n| Tài chính | Lãi suất, dòng tiền | Cơ cấu vốn thận trọng |\n\n## Kết luận đề xuất\n\n- Nêu rõ dự án nên **đầu tư / hoãn / từ chối / điều chỉnh**.\n- Kèm điều kiện tiên quyết và các giả định then chốt.\n\n## Checklist\n\n- [ ] Đủ 5 khía cạnh khả thi\n- [ ] Bảng rủi ro kèm biện pháp giảm thiểu\n- [ ] Phân tích kịch bản (tốt/cơ sở/xấu)\n- [ ] Kết luận và điều kiện rõ ràng\n\n\u003e **Mẹo:** Một dự án hấp dẫn về tài chính vẫn có thể thất bại vì **rủi ro pháp lý hoặc thị trường** — đánh giá đa chiều giúp tránh \"bẫy con số đẹp\".\n27:T804,---\ntitle: \"Phân tích khả thi và rủi ro dự án đầu tư\"\ndepartment: \"investment\"\nsummary: \"Khung phân tích khả thi đa chiều (thị trường, kỹ thuật, tài chính, pháp lý) và nhận diện rủi ro trước khi quyết định đầu tư.\"\ntags: [\"khả thi\", \"rủi ro\", \"đầu tư\"]\ndifficulty: \"Nâng cao\"\nauthor: \"Phòng Đầu tư\"\nupdated: \"2026-07-30\"\nreadingTime: \"7 phút\"\n---\n\n## Mục tiêu\n\nĐánh giá dự án có **khả thi toàn diện** hay không trước khi cam kết vốn — không chỉ nhìn con số tài chính.\n\n## Các khía cạnh khả thi\n\n1. **Thị trường** — nhu cầu, giá bán/cho thuê, cạnh tranh, hấp thụ.\n2. **Kỹ thuật** — địa điểm, quy hoạch, giải pháp thi công, tiến độ.\n3. **Tài chính** — tổng mức đầu tư, cơ cấu vốn, dòng tiền, NPV/IRR.\n4. **Pháp lý** — quyền sử dụng đất, giấy phép, điều kiện đầu tư.\n5. **Tổ chức** — năng lực triển khai, đối tác.\n\n## Nhận diện \u0026 xử lý rủi ro\n\n| Nhóm rủi ro | Ví dụ | Biện pháp |\n| --- | --- | --- |\n| Thị trường | Bán chậm, giá giảm | Phân kỳ đầu tư, khảo sát kỹ |\n| Chi phí | Vượt tổng mức đầu tư | Dự phòng, hợp đồng trọn gói |\n| Tiến độ | Chậm pháp lý, GPMB | Lập kế hoạch pháp lý sớm |\n| Tài chính | Lãi suất, dòng tiền | Cơ cấu vốn thận trọng |\n\n## Kết luận đề xuất\n\n- Nêu rõ dự án nên **đầu tư / hoãn / từ chối / điều chỉnh**.\n- Kèm điều kiện tiên quyết và các giả định then chốt.\n\n## Checklist\n\n- [ ] Đủ 5 khía cạnh khả thi\n- [ ] Bảng rủi ro kèm biện pháp giảm thiểu\n- [ ] Phân tích kịch bản (tốt/cơ sở/xấu)\n- [ ] Kết luận và điều kiện rõ ràng\n\n\u003e **Mẹo:** Một dự án hấp dẫn về tài chính vẫn có thể thất bại vì **rủi ro pháp lý hoặc thị trường** — đánh giá đa chiều giúp tránh \"bẫy con số đẹp\".\n28:T5d7,\n## Mục tiêu\n\nGhi nhận chi phí **đúng công trình, đúng khoản mục** để tính giá thành chính xác và phục vụ kiểm soát chi phí.\n\n## Hệ thống mã chi phí (cost code)\n\nMỗi khoản chi được gắn mã theo cấu trúc thống nhất, ví dụ:\n\n```text\n\u003cMã công trình\u003e - \u003cHạng mục\u003e - \u003cKhoản mục chi phí\u003e\nCT01 - MONG - NVL   (nguyên vật liệu)\nCT01 - MONG - NC    (nhân công)\nCT01 - MONG - MTC   (máy thi công)\n```\n\n## Nhóm chi phí cơ bản\n\n| Nhóm | Ví dụ |\n| --- | --- |\n| Nguyên vật liệu (NVL) | Xi măng, thép, cốt liệu |\n| Nhân công (NC) | Lương công nhân, thầu phụ nhân công |\n| Máy thi công (MTC) | Thuê/khấu hao cẩu, máy đào |\n| Chi phí chung | Lán trại, điện nước, quản lý công trường |\n\n## Nguyên tắc hạch toán\n\n- Đúng kỳ, đúng công trình, đúng khoản mục.\n- Chứng từ hợp lệ (hóa đơn, phiếu nhập, bảng lương).\n- Không \"gộp\" chi phí vào chi phí quản lý để tránh sai lệch giá thành.\n\n## Checklist\n\n- [ ] Mọi chứng từ được gắn mã công trình\n- [ ] Phân loại đúng nhóm chi phí\n- [ ] Đối chiếu với kho và khối lượng nghiệm thu\n- [ ] Số liệu khớp với báo cáo chi phí của công trường\n\n\u003e **Lưu ý:** Chi phí bị hạch toán sai mã khiến báo cáo giá thành mất chính xác — đây là gốc rễ của nhiều sai lệch giữa kế toán và công trường.\n29:T761,---\ntitle: \"Hạch toán chi phí công trình theo khoản mục\"\ndepartment: \"finance\"\nsummary: \"Cách phân loại và ghi nhận chi phí công trình theo hệ thống mã chi phí để theo dõi giá thành chính xác.\"\ntags: [\"kế toán\", \"chi phí\", \"mã chi phí\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng Tài chính - Kế toán\"\nupdated: \"2026-07-30\"\nreadingTime: \"6 phút\"\n---\n\n## Mục tiêu\n\nGhi nhận chi phí **đúng công trình, đúng khoản mục** để tính giá thành chính xác và phục vụ kiểm soát chi phí.\n\n## Hệ thống mã chi phí (cost code)\n\nMỗi khoản chi được gắn mã theo cấu trúc thống nhất, ví dụ:\n\n```text\n\u003cMã công trình\u003e - \u003cHạng mục\u003e - \u003cKhoản mục chi phí\u003e\nCT01 - MONG - NVL   (nguyên vật liệu)\nCT01 - MONG - NC    (nhân công)\nCT01 - MONG - MTC   (máy thi công)\n```\n\n## Nhóm chi phí cơ bản\n\n| Nhóm | Ví dụ |\n| --- | --- |\n| Nguyên vật liệu (NVL) | Xi măng, thép, cốt liệu |\n| Nhân công (NC) | Lương công nhân, thầu phụ nhân công |\n| Máy thi công (MTC) | Thuê/khấu hao cẩu, máy đào |\n| Chi phí chung | Lán trại, điện nước, quản lý công trường |\n\n## Nguyên tắc hạch toán\n\n- Đúng kỳ, đúng công trình, đúng khoản mục.\n- Chứng từ hợp lệ (hóa đơn, phiếu nhập, bảng lương).\n- Không \"gộp\" chi phí vào chi phí quản lý để tránh sai lệch giá thành.\n\n## Checklist\n\n- [ ] Mọi chứng từ được gắn mã công trình\n- [ ] Phân loại đúng nhóm chi phí\n- [ ] Đối chiếu với kho và khối lượng nghiệm thu\n- [ ] Số liệu khớp với báo cáo chi phí của công trường\n\n\u003e **Lưu ý:** Chi phí bị hạch toán sai mã khiến báo cáo giá thành mất chính xác — đây là gốc rễ của nhiều sai lệch giữa kế toán và công trường.\n2a:T5f7,---\ntitle: \"Review code hiệu quả\"\ndepartment: \"engineering\"\nsummary: \"Nguyên tắc và checklist để review pull request nhanh, chất lượng và tôn trọng đồng đội.\"\ntags: [\"code review\", \"chất lượng\", \"pull request\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng Kỹ thuật\"\nupdated: \"2026-07-30\"\nreadingTime: \"7 phút\"\nfeatured: true\n---\n\n## Mục tiêu\n\nĐảm bảo mọi thay đổi code được kiểm tra về **tính đúng đắn, khả năng bảo trì và bảo mật** trước khi merge.\n\n## Nguyên tắc\n\n1. Review **nhỏ và thường xuyên** hơn là dồn một PR khổng lồ.\n2. Bình luận về **code, không về con người**.\n3. Phân biệt rõ *bắt buộc sửa* và *góp ý tuỳ chọn* (dùng tiền tố `nit:`).\n\n## Checklist khi review\n\n- [ ] Thay đổi có giải quyết đúng vấn đề mô tả trong PR không?\n- [ ] Có test bao phủ phần logic mới không?\n- [ ] Có xử lý các trường hợp biên (null, rỗng, lỗi mạng)?\n- [ ] Đặt tên biến/hàm rõ nghĩa?\n- [ ] Không lộ secret/API key?\n\n## Ví dụ bình luận tốt\n\n```text\nnit: Có thể tách hàm này thành helper để tái sử dụng.\nblocker: Query này thiếu index -\u003e có nguy cơ full scan trên bảng lớn.\n```\n\n## SLA đề xuất\n\n| Loại PR | Thời gian phản hồi |\n| --- | --- |\n| Hotfix | \u003c 1 giờ |\n| Thường | \u003c 1 ngày làm việc |\n\n\u003e **Lưu ý:** Nếu tranh luận quá 2 vòng bình luận, hãy chuyển sang trao đổi trực tiếp.\n2b:T61d,---\ntitle: \"Cấp phép công việc nóng (Hot Work Permit)\"\ndepartment: \"hse\"\nsummary: \"Quy trình cấp phép và kiểm soát các công việc phát sinh nhiệt/tia lửa như hàn, cắt để phòng cháy nổ.\"\ntags: [\"an toàn\", \"hàn cắt\", \"phòng cháy\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng An toàn (HSE)\"\nupdated: \"2026-07-30\"\nreadingTime: \"5 phút\"\n---\n\n## Mục tiêu\n\nKiểm soát công việc sinh nhiệt/tia lửa (hàn, cắt, mài) để **ngăn cháy nổ** tại công trường.\n\n## Khi nào cần giấy phép\n\nMọi công việc hàn, cắt hơi, mài kim loại, hoặc dùng ngọn lửa trần — đặc biệt gần vật liệu dễ cháy.\n\n## Điều kiện trước khi cấp phép\n\n- [ ] Dọn sạch vật liệu dễ cháy trong bán kính an toàn\n- [ ] Bố trí bình chữa cháy phù hợp tại chỗ\n- [ ] Có người canh lửa (fire watch) trong và sau khi làm\n- [ ] Che chắn tia lửa, bảo vệ khu vực bên dưới\n- [ ] Thiết bị hàn/cắt còn tốt, dây tiếp địa đầy đủ\n\n## Quy trình\n\n1. Người thực hiện đề nghị cấp phép, nêu vị trí \u0026 thời gian.\n2. Cán bộ an toàn kiểm tra hiện trường theo checklist.\n3. Cấp giấy phép có **thời hạn** (thường trong ca).\n4. Giám sát trong khi làm; duy trì canh lửa **tối thiểu 30-60 phút** sau khi xong.\n5. Đóng giấy phép khi khu vực an toàn.\n\n\u003e **Cảnh báo:** Nhiều đám cháy bùng phát *sau khi* thợ hàn rời đi — không bỏ qua bước canh lửa sau công việc.\n2c:T653,---\ntitle: \"Xử lý phiếu không phù hợp (NCR)\"\ndepartment: \"qaqc\"\nsummary: \"Quy trình phát hành và đóng phiếu Non-Conformance Report khi phát hiện công việc không đạt yêu cầu chất lượng.\"\ntags: [\"ncr\", \"không phù hợp\", \"chất lượng\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng QA/QC\"\nupdated: \"2026-07-29\"\nreadingTime: \"5 phút\"\n---\n\n## Mục tiêu\n\nXử lý **có hệ thống** các sản phẩm/công tác không đạt, đảm bảo được khắc phục và ngăn tái diễn.\n\n## Quy trình NCR\n\n1. **Phát hiện \u0026 ghi nhận** — mô tả sai khác so với tiêu chuẩn, kèm ảnh/vị trí.\n2. **Phân loại phương án xử lý:**\n   - Sửa chữa (rework) về đúng thiết kế\n   - Sửa để dùng được (repair) — cần tính toán/duyệt\n   - Chấp nhận có điều kiện (use-as-is) — phải được duyệt\n   - Loại bỏ (reject)\n3. **Phê duyệt phương án** — tư vấn thiết kế / chủ đầu tư khi cần.\n4. **Thực hiện khắc phục** và kiểm tra lại.\n5. **Hành động phòng ngừa** — tránh lặp lại.\n6. **Đóng NCR** — ký xác nhận đã đạt.\n\n## Nội dung tối thiểu của phiếu\n\n- [ ] Mã NCR, ngày, vị trí, hạng mục\n- [ ] Mô tả không phù hợp + tiêu chuẩn vi phạm\n- [ ] Phương án xử lý và người duyệt\n- [ ] Bằng chứng khắc phục (ảnh, kết quả thí nghiệm)\n\n\u003e **Lưu ý:** NCR không phải để \"bắt lỗi\" cá nhân, mà để kiểm soát chất lượng và cải tiến. Ghi nhận trung thực giúp toàn dự án tốt hơn.\n2d:T57b,\n## Mục tiêu\n\nĐảm bảo dự án **đầy đủ hồ sơ pháp lý** theo từng giai đoạn, tránh bị xử phạt hoặc đình chỉ thi công.\n\n## Hồ sơ theo giai đoạn (tổng quát)\n\n### Chuẩn bị đầu tư\n- Chủ trương đầu tư / quyết định đầu tư\n- Quyền sử dụng đất, quy hoạch\n- Đánh giá tác động môi trường (nếu thuộc diện)\n\n### Thiết kế \u0026 cấp phép\n- Thẩm định, phê duyệt thiết kế\n- Giấy phép xây dựng\n\n### Thi công\n- Hợp đồng, bảo lãnh, bảo hiểm công trình\n- Hồ sơ an toàn lao động, PCCC\n- Nhật ký thi công, hồ sơ nghiệm thu\n\n### Hoàn thành\n- Nghiệm thu hoàn thành, PCCC nghiệm thu\n- Hoàn công, bàn giao đưa vào sử dụng\n\n## Checklist kiểm soát tuân thủ\n\n- [ ] Lập danh mục hồ sơ pháp lý theo giai đoạn\n- [ ] Theo dõi thời hạn hiệu lực của giấy phép\n- [ ] Phân công người phụ trách từng đầu hồ sơ\n- [ ] Rà soát định kỳ, cảnh báo hồ sơ sắp hết hạn\n\n\u003e **Cảnh báo:** Thi công khi chưa đủ giấy phép hoặc để hồ sơ hết hạn có thể dẫn tới **đình chỉ và xử phạt** — luôn kiểm tra trước mỗi mốc quan trọng.\n\u003e\n\u003e *Danh mục trên mang tính tổng quát; cần đối chiếu quy định pháp luật hiện hành và đặc thù từng dự án.*\n2e:T6e3,---\ntitle: \"Tuân thủ pháp lý dự án xây dựng\"\ndepartment: \"legal\"\nsummary: \"Danh mục hồ sơ pháp lý và giấy phép cần tuân thủ theo các giai đoạn của một dự án xây dựng.\"\ntags: [\"pháp lý\", \"giấy phép\", \"tuân thủ\"]\ndifficulty: \"Nâng cao\"\nauthor: \"Phòng Pháp lý\"\nupdated: \"2026-07-29\"\nreadingTime: \"7 phút\"\n---\n\n## Mục tiêu\n\nĐảm bảo dự án **đầy đủ hồ sơ pháp lý** theo từng giai đoạn, tránh bị xử phạt hoặc đình chỉ thi công.\n\n## Hồ sơ theo giai đoạn (tổng quát)\n\n### Chuẩn bị đầu tư\n- Chủ trương đầu tư / quyết định đầu tư\n- Quyền sử dụng đất, quy hoạch\n- Đánh giá tác động môi trường (nếu thuộc diện)\n\n### Thiết kế \u0026 cấp phép\n- Thẩm định, phê duyệt thiết kế\n- Giấy phép xây dựng\n\n### Thi công\n- Hợp đồng, bảo lãnh, bảo hiểm công trình\n- Hồ sơ an toàn lao động, PCCC\n- Nhật ký thi công, hồ sơ nghiệm thu\n\n### Hoàn thành\n- Nghiệm thu hoàn thành, PCCC nghiệm thu\n- Hoàn công, bàn giao đưa vào sử dụng\n\n## Checklist kiểm soát tuân thủ\n\n- [ ] Lập danh mục hồ sơ pháp lý theo giai đoạn\n- [ ] Theo dõi thời hạn hiệu lực của giấy phép\n- [ ] Phân công người phụ trách từng đầu hồ sơ\n- [ ] Rà soát định kỳ, cảnh báo hồ sơ sắp hết hạn\n\n\u003e **Cảnh báo:** Thi công khi chưa đủ giấy phép hoặc để hồ sơ hết hạn có thể dẫn tới **đình chỉ và xử phạt** — luôn kiểm tra trước mỗi mốc quan trọng.\n\u003e\n\u003e *Danh mục trên mang tính tổng quát; cần đối chiếu quy định pháp luật hiện hành và đặc thù từng dự án.*\n2f:T6d6,\n## Mục tiêu\n\nBảo vệ quyền lợi khi phát sinh sự kiện làm **tăng thời gian/chi phí** — thông qua hồ sơ claim chặt chẽ và đúng thời hạn.\n\n## Nguyên tắc cốt lõi\n\n1. **Tuân thủ thời hạn thông báo (notice).** Nhiều hợp đồng (ví dụ mẫu FIDIC 2017) yêu cầu **thông báo trong 28 ngày** kể từ khi biết sự kiện; hồ sơ chi tiết thường nộp trong **84 ngày**. Trễ hạn có thể **mất quyền** đòi.\n2. **Thông báo sớm** ngay cả khi chưa biết hết tác động — giữ quyền trước, bổ sung chi tiết sau.\n3. **Hồ sơ đồng thời là xương sống** — nhật ký, hình ảnh, biên bản họp, công văn, hồ sơ chi phí.\n\n## Cấu trúc một hồ sơ claim\n\n- **Căn cứ hợp đồng** — điều khoản cho phép đòi.\n- **Diễn biến sự kiện** — mốc thời gian, nguyên nhân.\n- **Chứng minh quan hệ nhân - quả** — sự kiện → ảnh hưởng.\n- **Định lượng** — thời gian (EOT) và/hoặc chi phí, có chứng từ.\n\n## Checklist\n\n- [ ] Phát hành notice đúng thời hạn, đúng mẫu\n- [ ] Thu thập hồ sơ đồng thời ngay khi sự kiện xảy ra\n- [ ] Tách mã chi phí phát sinh để định lượng\n- [ ] Liên kết rõ nguyên nhân và ảnh hưởng\n- [ ] Nộp hồ sơ chi tiết trong thời hạn quy định\n\n\u003e **Cảnh báo:** Một claim hợp lệ vẫn có thể **thất bại vì thiếu bằng chứng** hoặc **trễ thời hạn thông báo**. Kỷ luật hồ sơ quan trọng ngang với lý lẽ.\n\u003e\n\u003e *Thời hạn cụ thể tùy theo điều kiện hợp đồng của từng dự án — luôn đối chiếu hợp đồng đang áp dụng.*\n30:T883,"])</script><script>self.__next_f.push([1,"---\ntitle: \"Lập và xử lý hồ sơ claim hợp đồng\"\ndepartment: \"contracts\"\nsummary: \"Quy trình lập hồ sơ khiếu nại (claim) đòi thêm thời gian/chi phí: tuân thủ thời hạn thông báo và chứng minh bằng hồ sơ đồng thời.\"\ntags: [\"claim\", \"khiếu nại\", \"hợp đồng\"]\ndifficulty: \"Nâng cao\"\nauthor: \"Phòng Quản lý hợp đồng\"\nupdated: \"2026-07-28\"\nreadingTime: \"7 phút\"\n---\n\n## Mục tiêu\n\nBảo vệ quyền lợi khi phát sinh sự kiện làm **tăng thời gian/chi phí** — thông qua hồ sơ claim chặt chẽ và đúng thời hạn.\n\n## Nguyên tắc cốt lõi\n\n1. **Tuân thủ thời hạn thông báo (notice).** Nhiều hợp đồng (ví dụ mẫu FIDIC 2017) yêu cầu **thông báo trong 28 ngày** kể từ khi biết sự kiện; hồ sơ chi tiết thường nộp trong **84 ngày**. Trễ hạn có thể **mất quyền** đòi.\n2. **Thông báo sớm** ngay cả khi chưa biết hết tác động — giữ quyền trước, bổ sung chi tiết sau.\n3. **Hồ sơ đồng thời là xương sống** — nhật ký, hình ảnh, biên bản họp, công văn, hồ sơ chi phí.\n\n## Cấu trúc một hồ sơ claim\n\n- **Căn cứ hợp đồng** — điều khoản cho phép đòi.\n- **Diễn biến sự kiện** — mốc thời gian, nguyên nhân.\n- **Chứng minh quan hệ nhân - quả** — sự kiện → ảnh hưởng.\n- **Định lượng** — thời gian (EOT) và/hoặc chi phí, có chứng từ.\n\n## Checklist\n\n- [ ] Phát hành notice đúng thời hạn, đúng mẫu\n- [ ] Thu thập hồ sơ đồng thời ngay khi sự kiện xảy ra\n- [ ] Tách mã chi phí phát sinh để định lượng\n- [ ] Liên kết rõ nguyên nhân và ảnh hưởng\n- [ ] Nộp hồ sơ chi tiết trong thời hạn quy định\n\n\u003e **Cảnh báo:** Một claim hợp lệ vẫn có thể **thất bại vì thiếu bằng chứng** hoặc **trễ thời hạn thông báo**. Kỷ luật hồ sơ quan trọng ngang với lý lẽ.\n\u003e\n\u003e *Thời hạn cụ thể tùy theo điều kiện hợp đồng của từng dự án — luôn đối chiếu hợp đồng đang áp dụng.*\n31:T559,\n## Mục tiêu\n\nGiúp nhân viên mới **hội nhập nhanh**, hiểu rõ kỳ vọng công việc và bắt đầu đóng góp trong vòng 30 ngày.\n\n## Khi nào dùng skill này\n\n- Có nhân viên mới nhận việc.\n- Cần chuẩn hóa trải nghiệm onboarding giữa các phòng ban.\n\n## Các bước thực hiện\n\n### Trước ngày đầu tiên (D-3)\n1. Chuẩn bị tài khoản email, công cụ nội bộ và quyền truy cập.\n2. Gán một **buddy** (người đồng hành) cùng phòng ban.\n3. Gửi email chào mừng kèm lịch tuần đầu.\n\n### Tuần 1 — Làm quen\n- Giới thiệu đội nhóm và văn hóa công ty.\n- Đọc tài liệu quy trình cốt lõi của phòng ban.\n- Thiết lập môi trường làm việc và công cụ.\n\n### Tuần 2-3 — Bắt tay vào việc\n- Nhận nhiệm vụ nhỏ có phạm vi rõ ràng.\n- Họp 1:1 với quản lý mỗi tuần để tháo gỡ vướng mắc.\n\n### Tuần 4 — Đánh giá\n- Tổng kết những gì đã học và đóng góp.\n- Thống nhất mục tiêu 60-90 ngày tiếp theo.\n\n## Checklist nhanh\n\n- [ ] Tài khoản \u0026 quyền truy cập\n- [ ] Buddy được chỉ định\n- [ ] Lịch 1:1 hàng tuần\n- [ ] Mục tiêu 30/60/90 ngày\n\n\u003e **Mẹo:** Một trải nghiệm onboarding tốt trong tháng đầu làm tăng đáng kể tỷ lệ giữ chân nhân viên.\n32:T6dc,---\ntitle: \"Onboarding nhân viên mới trong 30 ngày\"\ndepartment: \"hr\"\nsummary: \"Lộ trình chuẩn giúp nhân viên mới hội nhập nhanh, rõ vai trò và bắt đầu tạo giá trị trong tháng đầu tiên.\"\ntags: [\"onboarding\", \"quy trình\", \"văn hóa\"]\ndifficulty: \"Cơ bản\"\nauthor: \"Phòng Nhân sự\"\nupdated: \"2026-07-28\"\nreadingTime: \"6 phút\"\nfeatured: true\n---\n\n## Mục tiêu\n\nGiúp nhân viên mới **hội nhập nhanh**, hiểu rõ kỳ vọng công việc và bắt đầu đóng góp trong vòng 30 ngày.\n\n## Khi nào dùng skill này\n\n- Có nhân viên mới nhận việc.\n- Cần chuẩn hóa trải nghiệm onboarding giữa các phòng ban.\n\n## Các bước thực hiện\n\n### Trước ngày đầu tiên (D-3)\n1. Chuẩn bị tài khoản email, công cụ nội bộ và quyền truy cập.\n2. Gán một **buddy** (người đồng hành) cùng phòng ban.\n3. Gửi email chào mừng kèm lịch tuần đầu.\n\n### Tuần 1 — Làm quen\n- Giới thiệu đội nhóm và văn hóa công ty.\n- Đọc tài liệu quy trình cốt lõi của phòng ban.\n- Thiết lập môi trường làm việc và công cụ.\n\n### Tuần 2-3 — Bắt tay vào việc\n- Nhận nhiệm vụ nhỏ có phạm vi rõ ràng.\n- Họp 1:1 với quản lý mỗi tuần để tháo gỡ vướng mắc.\n\n### Tuần 4 — Đánh giá\n- Tổng kết những gì đã học và đóng góp.\n- Thống nhất mục tiêu 60-90 ngày tiếp theo.\n\n## Checklist nhanh\n\n- [ ] Tài khoản \u0026 quyền truy cập\n- [ ] Buddy được chỉ định\n- [ ] Lịch 1:1 hàng tuần\n- [ ] Mục tiêu 30/60/90 ngày\n\n\u003e **Mẹo:** Một trải nghiệm onboarding tốt trong tháng đầu làm tăng đáng kể tỷ lệ giữ chân nhân viên.\n33:T6c8,---\ntitle: \"Quy trình mua và nghiệm thu vật tư đầu vào\"\ndepartment: \"procurement\"\nsummary: \"Từ đề nghị mua đến nhập kho công trường: kiểm soát chất lượng, chứng từ và số lượng vật tư đầu vào.\"\ntags: [\"vật tư\", \"mua sắm\", \"nghiệm thu\"]\ndifficulty: \"Cơ bản\"\nauthor: \"Phòng Vật tư - Thiết bị\"\nupdated: \"2026-07-28\"\nreadingTime: \"6 phút\"\n---\n\n## Mục tiêu\n\nĐảm bảo vật tư về công trường **đúng chủng loại, đủ số lượng, đạt chất lượng** và đầy đủ chứng từ.\n\n## Quy trình\n\n1. **Đề nghị mua** — từ kế hoạch vật tư theo tiến độ.\n2. **Chọn nhà cung cấp** — so sánh báo giá, năng lực, tiến độ giao.\n3. **Duyệt \u0026 đặt hàng** — theo hạn mức phê duyệt.\n4. **Nghiệm thu nhập kho** — kiểm tra khi hàng về.\n5. **Lưu hồ sơ** — hóa đơn, CO/CQ, phiếu nhập.\n\n## Nghiệm thu vật tư khi giao\n\n- [ ] Đúng chủng loại, quy cách, mác theo đơn hàng\n- [ ] Đủ số lượng (cân/đo/đếm thực tế)\n- [ ] Có chứng chỉ chất lượng (CO/CQ) với vật tư yêu cầu\n- [ ] Lấy mẫu thí nghiệm với vật tư chịu lực (thép, xi măng, cốt liệu)\n- [ ] Không hư hỏng, ẩm mốc, gỉ sét\n\n## Vật tư cần thí nghiệm đầu vào (ví dụ)\n\n| Vật tư | Chỉ tiêu thường kiểm |\n| --- | --- |\n| Thép | Giới hạn chảy, độ giãn dài, uốn nguội |\n| Xi măng | Cường độ, thời gian đông kết |\n| Cốt liệu | Thành phần hạt, hàm lượng bùn sét |\n\n\u003e **Lưu ý:** Không đưa vào sử dụng vật tư chịu lực khi chưa có kết quả thí nghiệm đạt yêu cầu.\n34:T5b2,---\ntitle: \"Viết PRD (Product Requirements Document)\"\ndepartment: \"product\"\nsummary: \"Mẫu tài liệu yêu cầu sản phẩm giúp cả team hiểu vấn đề, giải pháp và tiêu chí thành công.\"\ntags: [\"prd\", \"sản phẩm\", \"tài liệu\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng Sản phẩm\"\nupdated: \"2026-07-27\"\nreadingTime: \"7 phút\"\n---\n\n## Mục tiêu\n\nTạo tài liệu để **cả team đồng thuận** về việc *xây gì* và *tại sao*, trước khi viết dòng code đầu tiên.\n\n## Cấu trúc PRD\n\n1. **Bối cảnh \u0026 Vấn đề** — Ai gặp vấn đề gì, ảnh hưởng ra sao.\n2. **Mục tiêu \u0026 Chỉ số** — Định nghĩa thành công (metrics).\n3. **Phạm vi** — Làm gì và **không** làm gì (out of scope).\n4. **User stories** — \"Là [vai trò], tôi muốn [hành động] để [lợi ích]\".\n5. **Yêu cầu chức năng** — Chi tiết hành vi mong muốn.\n6. **Rủi ro \u0026 Câu hỏi mở**.\n\n## Ví dụ tiêu chí thành công\n\n```text\nMục tiêu: Giảm tỷ lệ bỏ giỏ hàng.\nChỉ số: Tỷ lệ hoàn tất thanh toán tăng từ 60% -\u003e 70% trong 1 tháng.\n```\n\n## Checklist chất lượng PRD\n\n- [ ] Vấn đề được nêu rõ ràng, có dữ liệu\n- [ ] Mục tiêu đo lường được\n- [ ] Phạm vi (in/out) rõ ràng\n- [ ] Đã review cùng Kỹ thuật \u0026 Thiết kế\n\n\u003e **Mẹo:** PRD tốt trả lời được câu hỏi \"làm sao biết đã thành công?\".\n35:T60f,\n## Mục tiêu\n\nNộp hồ sơ dự thầu **đầy đủ, đúng yêu cầu, đúng hạn** — tránh bị loại vì lỗi hình thức hoặc thiếu tài liệu.\n\n## Cấu phần hồ sơ (tổng quát)\n\n1. **Hồ sơ pháp lý \u0026 năng lực** — đăng ký kinh doanh, báo cáo tài chính, hợp đồng tương tự.\n2. **Đề xuất kỹ thuật** — biện pháp thi công, tiến độ, nhân sự, thiết bị.\n3. **Đề xuất tài chính** — bảng giá dự thầu, phân tích đơn giá.\n4. **Bảo đảm dự thầu** — bảo lãnh theo yêu cầu.\n\n## Quy trình lập hồ sơ\n\n1. **Đọc kỹ hồ sơ mời thầu (HSMT)** — lập danh mục yêu cầu bắt buộc.\n2. **Phân công \u0026 lịch** — ai làm phần nào, hạn nội bộ trước hạn nộp.\n3. **Bóc khối lượng \u0026 chào giá** — kiểm tra chéo số học.\n4. **Soát xét chéo** — đối chiếu với từng yêu cầu của HSMT.\n5. **Đóng gói \u0026 nộp** — đúng quy cách, đúng hạn.\n\n## Checklist trước khi nộp\n\n- [ ] Đủ tài liệu theo danh mục HSMT\n- [ ] Bảo đảm dự thầu hợp lệ (giá trị, thời hạn)\n- [ ] Đơn giá đã kiểm tra chéo, không lỗi số học\n- [ ] Chữ ký, đóng dấu, niêm phong đúng quy định\n- [ ] Nộp trước thời điểm đóng thầu\n\n\u003e **Cảnh báo:** Rất nhiều hồ sơ bị loại vì **lỗi hình thức** (thiếu bảo lãnh, sai quy cách, nộp trễ) chứ không phải vì giá. Kiểm tra tuân thủ HSMT là bước sống còn.\n36:T7a5,---\ntitle: \"Chuẩn bị hồ sơ dự thầu\"\ndepartment: \"estimating\"\nsummary: \"Checklist tổ chức lập hồ sơ dự thầu đầy đủ, đúng yêu cầu và nộp đúng hạn để không bị loại vì lỗi hình thức.\"\ntags: [\"dự thầu\", \"hồ sơ\", \"đấu thầu\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng Dự toán - Đấu thầu\"\nupdated: \"2026-07-27\"\nreadingTime: \"6 phút\"\n---\n\n## Mục tiêu\n\nNộp hồ sơ dự thầu **đầy đủ, đúng yêu cầu, đúng hạn** — tránh bị loại vì lỗi hình thức hoặc thiếu tài liệu.\n\n## Cấu phần hồ sơ (tổng quát)\n\n1. **Hồ sơ pháp lý \u0026 năng lực** — đăng ký kinh doanh, báo cáo tài chính, hợp đồng tương tự.\n2. **Đề xuất kỹ thuật** — biện pháp thi công, tiến độ, nhân sự, thiết bị.\n3. **Đề xuất tài chính** — bảng giá dự thầu, phân tích đơn giá.\n4. **Bảo đảm dự thầu** — bảo lãnh theo yêu cầu.\n\n## Quy trình lập hồ sơ\n\n1. **Đọc kỹ hồ sơ mời thầu (HSMT)** — lập danh mục yêu cầu bắt buộc.\n2. **Phân công \u0026 lịch** — ai làm phần nào, hạn nội bộ trước hạn nộp.\n3. **Bóc khối lượng \u0026 chào giá** — kiểm tra chéo số học.\n4. **Soát xét chéo** — đối chiếu với từng yêu cầu của HSMT.\n5. **Đóng gói \u0026 nộp** — đúng quy cách, đúng hạn.\n\n## Checklist trước khi nộp\n\n- [ ] Đủ tài liệu theo danh mục HSMT\n- [ ] Bảo đảm dự thầu hợp lệ (giá trị, thời hạn)\n- [ ] Đơn giá đã kiểm tra chéo, không lỗi số học\n- [ ] Chữ ký, đóng dấu, niêm phong đúng quy định\n- [ ] Nộp trước thời điểm đóng thầu\n\n\u003e **Cảnh báo:** Rất nhiều hồ sơ bị loại vì **lỗi hình thức** (thiếu bảo lãnh, sai quy cách, nộp trễ) chứ không phải vì giá. Kiểm tra tuân thủ HSMT là bước sống còn.\n37:T680,---\ntitle: \"Khóa sổ và lập báo cáo tài chính tháng\"\ndepartment: \"finance\"\nsummary: \"Checklist các bước khóa sổ cuối tháng để lập báo cáo tài chính đúng hạn, đầy đủ và đối chiếu khớp.\"\ntags: [\"kế toán\", \"khóa sổ\", \"báo cáo\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng Tài chính - Kế toán\"\nupdated: \"2026-07-26\"\nreadingTime: \"5 phút\"\n---\n\n## Mục tiêu\n\nĐóng sổ kế toán tháng **đúng hạn, chính xác, đối chiếu khớp** để có báo cáo phục vụ điều hành.\n\n## Trình tự khóa sổ\n\n1. **Ghi nhận đầy đủ** hóa đơn, chứng từ trong kỳ.\n2. **Đối chiếu** ngân hàng, công nợ phải thu/phải trả, kho.\n3. **Phân bổ \u0026 trích** khấu hao, chi phí trả trước, dự phòng.\n4. **Rà soát bút toán** bất thường, số dư âm.\n5. **Kết chuyển** doanh thu - chi phí, xác định kết quả.\n6. **Lập báo cáo** và giải trình biến động.\n\n## Checklist đối chiếu\n\n- [ ] Số dư ngân hàng khớp sao kê\n- [ ] Công nợ khớp biên bản đối chiếu\n- [ ] Tồn kho khớp kiểm kê\n- [ ] Chi phí công trình khớp báo cáo công trường\n- [ ] Thuế GTGT/TNCN đã kê khai\n\n## Sản phẩm đầu ra\n\n| Báo cáo | Mục đích |\n| --- | --- |\n| Bảng cân đối kế toán | Tình hình tài sản - nguồn vốn |\n| Báo cáo kết quả kinh doanh | Lãi/lỗ trong kỳ |\n| Báo cáo dòng tiền | Thu - chi tiền mặt |\n\n\u003e **Mẹo:** Lập **lịch khóa sổ** với hạn chót cho từng đầu việc và người phụ trách — khóa sổ trễ làm cả chuỗi báo cáo trễ theo.\n38:T533,---\ntitle: \"Lập kế hoạch chiến dịch Marketing\"\ndepartment: \"marketing\"\nsummary: \"Khung lập kế hoạch chiến dịch từ mục tiêu, đối tượng, thông điệp đến kênh và đo lường.\"\ntags: [\"chiến dịch\", \"kế hoạch\", \"content\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng Marketing\"\nupdated: \"2026-07-25\"\nreadingTime: \"6 phút\"\nfeatured: true\n---\n\n## Mục tiêu\n\nXây dựng chiến dịch có **mục tiêu đo lường được** và ngân sách hợp lý.\n\n## Khung 5W + Đo lường\n\n1. **Why** — Mục tiêu kinh doanh (nhận diện, lead, doanh thu).\n2. **Who** — Chân dung khách hàng mục tiêu.\n3. **What** — Thông điệp và ưu đãi cốt lõi.\n4. **Where** — Kênh triển khai (SEO, ads, email, social).\n5. **When** — Thời gian và các mốc chính.\n\n## KPI gợi ý\n\n| Mục tiêu | KPI |\n| --- | --- |\n| Nhận diện | Reach, impressions |\n| Tương tác | CTR, engagement rate |\n| Chuyển đổi | Số lead, CPL, ROAS |\n\n## Checklist trước khi chạy\n\n- [ ] Thông điệp thống nhất trên mọi kênh\n- [ ] Landing page \u0026 tracking (UTM) sẵn sàng\n- [ ] Ngân sách và lịch chạy được duyệt\n- [ ] Kế hoạch báo cáo hàng tuần\n\n\u003e **Mẹo:** Luôn để lại 10-15% ngân sách để tối ưu dựa trên dữ liệu thực tế.\n39:T635,---\ntitle: \"Chấm công và tính lương công nhân công trường\"\ndepartment: \"hr\"\nsummary: \"Quy trình chấm công minh bạch và tính lương chính xác cho công nhân, tổ đội tại công trường.\"\ntags: [\"chấm công\", \"tính lương\", \"công trường\"]\ndifficulty: \"Cơ bản\"\nauthor: \"Phòng Nhân sự\"\nupdated: \"2026-07-24\"\nreadingTime: \"5 phút\"\n---\n\n## Mục tiêu\n\nChấm công **minh bạch**, tính lương **đúng và đúng hạn** cho công nhân và tổ đội tại công trường.\n\n## Quy trình\n\n1. **Chấm công hàng ngày** — theo tổ đội, có xác nhận của tổ trưởng/giám sát.\n2. **Tổng hợp cuối kỳ** — công thường, tăng ca, ngày nghỉ, phụ cấp.\n3. **Đối chiếu khối lượng** — với công việc thực tế/nghiệm thu (nếu khoán).\n4. **Tính lương** — theo công nhật hoặc khoán khối lượng.\n5. **Duyệt \u0026 chi trả** — kèm bảng lương chi tiết.\n\n## Hình thức trả lương phổ biến\n\n| Hình thức | Cách tính |\n| --- | --- |\n| Công nhật | Số công × đơn giá ngày công |\n| Khoán khối lượng | Khối lượng nghiệm thu × đơn giá khoán |\n\n## Checklist minh bạch\n\n- [ ] Bảng công có xác nhận của tổ trưởng và giám sát\n- [ ] Đối chiếu công với nhật ký thi công\n- [ ] Bảng lương công khai cho người lao động\n- [ ] Lưu chứng từ ký nhận\n\n\u003e **Lưu ý:** Chấm công thiếu xác nhận hai chiều (tổ trưởng + giám sát) dễ dẫn tới khai khống hoặc tranh chấp lương.\n3a:T5cd,---\ntitle: \"Xử lý sự cố production (Incident Response)\"\ndepartment: \"engineering\"\nsummary: \"Quy trình ứng phó sự cố có mức độ ưu tiên rõ ràng, giảm thời gian downtime và học hỏi sau sự cố.\"\ntags: [\"incident\", \"vận hành\", \"on-call\"]\ndifficulty: \"Nâng cao\"\nauthor: \"Phòng Kỹ thuật\"\nupdated: \"2026-07-22\"\nreadingTime: \"8 phút\"\n---\n\n## Mục tiêu\n\nKhôi phục dịch vụ **nhanh nhất có thể** và rút ra bài học để không lặp lại.\n\n## Phân loại mức độ (Severity)\n\n| Mức | Ảnh hưởng | Ví dụ |\n| --- | --- | --- |\n| SEV1 | Toàn bộ hệ thống ngừng | Website down hoàn toàn |\n| SEV2 | Tính năng chính lỗi | Không thanh toán được |\n| SEV3 | Ảnh hưởng nhỏ | Lỗi hiển thị nhỏ |\n\n## Quy trình 5 bước\n\n1. **Phát hiện** — Nhận alert hoặc báo cáo từ khách hàng.\n2. **Điều phối** — Chỉ định một *Incident Commander*.\n3. **Giảm thiểu** — Ưu tiên khôi phục dịch vụ (rollback, tắt tính năng...).\n4. **Khắc phục** — Sửa triệt để nguyên nhân gốc.\n5. **Hậu sự cố** — Viết postmortem **không đổ lỗi** trong 48 giờ.\n\n## Mẫu thông báo nội bộ\n\n```text\n[SEV2] Thanh toán gián đoạn\nBắt đầu: 14:05\nẢnh hưởng: ~15% giao dịch thất bại\nĐang xử lý: rollback bản deploy 14:00\nIC: @ten-nguoi\n```\n\n\u003e **Nguyên tắc vàng:** Khôi phục trước, tìm nguyên nhân gốc sau.\n3b:T593,---\ntitle: \"Xử lý ticket hỗ trợ khách hàng\"\ndepartment: \"support\"\nsummary: \"Quy trình tiếp nhận, phân loại và phản hồi ticket theo SLA để giữ trải nghiệm khách hàng nhất quán.\"\ntags: [\"ticket\", \"sla\", \"hỗ trợ\"]\ndifficulty: \"Cơ bản\"\nauthor: \"Phòng Chăm sóc khách hàng\"\nupdated: \"2026-07-20\"\nreadingTime: \"5 phút\"\n---\n\n## Mục tiêu\n\nPhản hồi **đúng hạn, đúng người và đúng cách** cho mọi yêu cầu của khách hàng.\n\n## Phân loại ưu tiên\n\n| Mức | Mô tả | SLA phản hồi đầu |\n| --- | --- | --- |\n| Khẩn cấp | Mất dịch vụ hoàn toàn | 30 phút |\n| Cao | Ảnh hưởng nghiệp vụ chính | 2 giờ |\n| Thường | Câu hỏi, yêu cầu nhỏ | 1 ngày làm việc |\n\n## Quy trình\n\n1. **Tiếp nhận \u0026 xác nhận** — Trả lời tự động cho khách biết đã nhận.\n2. **Phân loại** — Gắn nhãn ưu tiên và chủ đề.\n3. **Xử lý** — Tự giải quyết hoặc chuyển (escalate) đúng bộ phận.\n4. **Đóng ticket** — Xác nhận khách đã hài lòng.\n\n## Mẫu phản hồi đầu tiên\n\n```text\nChào anh/chị, cảm ơn đã liên hệ.\nBên em đã tiếp nhận yêu cầu và đang kiểm tra.\nEm sẽ phản hồi chi tiết trong vòng [SLA].\n```\n\n\u003e **Mẹo:** Một câu xác nhận sớm giúp giảm mạnh sự lo lắng của khách hàng, ngay cả khi chưa có giải pháp.\n3c:T64e,---\ntitle: \"Kịch bản gọi điện bán hàng (Cold Call)\"\ndepartment: \"sales\"\nsummary: \"Cấu trúc cuộc gọi bán hàng chuyên nghiệp: mở đầu, khai thác nhu cầu, xử lý từ chối và chốt bước tiếp theo.\"\ntags: [\"bán hàng\", \"cold call\", \"kịch bản\"]\ndifficulty: \"Cơ bản\"\nauthor: \"Phòng Kinh doanh\"\nupdated: \"2026-07-18\"\nreadingTime: \"5 phút\"\n---\n\n## Mục tiêu\n\nBiến một cuộc gọi lạ thành **một cuộc hẹn hoặc bước tiếp theo rõ ràng**.\n\n## Cấu trúc cuộc gọi\n\n1. **Mở đầu (15 giây):** Chào, giới thiệu ngắn, xin phép 30 giây.\n2. **Câu hỏi khai thác:** Tìm hiểu vấn đề khách đang gặp.\n3. **Giá trị:** Kết nối sản phẩm với đúng vấn đề đó.\n4. **Xử lý từ chối:** Lắng nghe -\u003e đồng cảm -\u003e làm rõ.\n5. **Chốt bước tiếp theo:** Đặt lịch demo/gửi báo giá.\n\n## Mẫu mở đầu\n\n```text\nChào anh/chị, em là ... bên công ty ...\nEm gọi vì thấy bên mình đang [vấn đề cụ thể].\nAnh/chị cho em xin 30 giây được không ạ?\n```\n\n## Xử lý từ chối thường gặp\n\n| Khách nói | Phản hồi gợi ý |\n| --- | --- |\n| \"Đang bận\" | \"Em xin phép gọi lại lúc nào tiện cho anh/chị ạ?\" |\n| \"Không quan tâm\" | \"Dạ em hiểu, cho em hỏi hiện bên mình đang xử lý [vấn đề] thế nào ạ?\" |\n| \"Gửi email đi\" | \"Vâng em gửi ngay, em xin email để gửi đúng người ạ.\" |\n\n\u003e **Lưu ý:** Mục tiêu của cold call **không phải bán ngay**, mà là mở ra cuộc trò chuyện tiếp theo.\n3d:T583,---\ntitle: \"Quy trình duyệt và thanh toán hóa đơn\"\ndepartment: \"finance\"\nsummary: \"Chuẩn hóa việc tiếp nhận, kiểm tra, phê duyệt và thanh toán hóa đơn nhằm kiểm soát chi phí và tránh sai sót.\"\ntags: [\"hóa đơn\", \"thanh toán\", \"kiểm soát\"]\ndifficulty: \"Cơ bản\"\nauthor: \"Phòng Tài chính - Kế toán\"\nupdated: \"2026-07-15\"\nreadingTime: \"5 phút\"\n---\n\n## Mục tiêu\n\nĐảm bảo mọi khoản chi được **kiểm tra và phê duyệt đúng thẩm quyền** trước khi thanh toán.\n\n## Quy trình 4 bước\n\n1. **Tiếp nhận** — Nhận hóa đơn kèm PO/hợp đồng liên quan.\n2. **Kiểm tra** — Đối chiếu số tiền, thông tin thuế, người thụ hưởng.\n3. **Phê duyệt** — Theo hạn mức phê duyệt.\n4. **Thanh toán \u0026 Lưu trữ** — Thực hiện chi và lưu chứng từ.\n\n## Hạn mức phê duyệt (ví dụ)\n\n| Giá trị | Người duyệt |\n| --- | --- |\n| \u003c 10 triệu | Trưởng phòng |\n| 10 - 100 triệu | Giám đốc tài chính |\n| \u003e 100 triệu | Ban giám đốc |\n\n## Checklist kiểm tra hóa đơn\n\n- [ ] Thông tin công ty \u0026 mã số thuế chính xác\n- [ ] Có PO/hợp đồng đối chiếu\n- [ ] Số tiền và thuế đúng\n- [ ] Chưa từng thanh toán trùng\n\n\u003e **Cảnh báo:** Luôn kiểm tra trùng lặp trước khi chi để tránh thanh toán hai lần cho cùng một hóa đơn.\n3e:T574,---\ntitle: \"Nguyên tắc sử dụng Design System\"\ndepartment: \"product\"\nsummary: \"Hướng dẫn dùng design system nhất quán: token, component và khi nào được tạo ngoại lệ.\"\ntags: [\"design system\", \"ui\", \"nhất quán\"]\ndifficulty: \"Trung bình\"\nauthor: \"Phòng Sản phẩm\"\nupdated: \"2026-07-12\"\nreadingTime: \"6 phút\"\n---\n\n## Mục tiêu\n\nGiữ giao diện **nhất quán** và tăng tốc độ phát triển bằng cách tái sử dụng thành phần chung.\n\n## Nguyên tắc cốt lõi\n\n1. **Ưu tiên component có sẵn** trước khi tạo mới.\n2. **Dùng design token** (màu, khoảng cách, bo góc) thay vì giá trị cứng.\n3. **Nhất quán hơn hoàn hảo** — tuân thủ hệ thống kể cả khi có ý tưởng riêng.\n\n## Khi nào được tạo ngoại lệ\n\n- Có nhu cầu thực sự chưa được hệ thống hỗ trợ.\n- Đã trao đổi với người phụ trách design system.\n- Ghi lại lý do để cân nhắc đưa vào hệ thống sau này.\n\n## Checklist trước khi merge UI\n\n- [ ] Dùng token thay cho màu/spacing cứng\n- [ ] Tái sử dụng component chung khi có thể\n- [ ] Kiểm tra trạng thái: hover, focus, disabled\n- [ ] Kiểm tra khả năng tiếp cận (contrast, aria-label)\n\n\u003e **Mẹo:** Mỗi ngoại lệ không ghi lại hôm nay là một khoản \"nợ thiết kế\" phải trả trong tương lai.\n6:[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"div\",null,{\"className\":\"mx-auto max-w-6xl px-4 py-12 sm:px-6\",\"children\":[[\"$\",\"header\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"text-3xl font-bold tracking-tight\",\"children\":\"Tất cả skill\"}],[\"$\",\"p\",null,{\"className\":\"mt-2 text-[var(--muted)]\",\"children\":\"Tìm kiếm theo từ khóa hoặc lọc theo phòng ban để tìm đúng quy trình bạn cần.\"}]]}],[\"$\",\"$b\",null,{\"fallback\":[\"$\",\"p\",null,{\"className\":\"text-sm text-[var(--muted)]\",\"children\":\"Đang tải…\"}],\"children\":[\"$\",\"$Lc\",null,{\"skills\":[{\"title\":\"Lập và quản lý dòng tiền dự án (Cash flow)\",\"department\":\"finance\",\"summary\":\"Cách dự báo và kiểm soát dòng tiền dự án để không bị đứt vốn khi chi phí chi ra sớm hơn tiền nghiệm thu thu về.\",\"tags\":[\"dòng tiền\",\"cash flow\",\"tài chính\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng Tài chính - Kế toán\",\"updated\":\"2026-08-05\",\"readingTime\":\"7 phút\",\"featured\":true,\"slug\":\"lap-quan-ly-dong-tien-du-an\",\"content\":\"$d\",\"raw\":\"$e\",\"departmentInfo\":{\"slug\":\"finance\",\"name\":\"Tài chính - Kế toán\",\"shortName\":\"Tài chính\",\"description\":\"Lập ngân sách, thanh toán, báo cáo và tuân thủ quy định tài chính.\",\"icon\":\"📊\",\"gradient\":\"from-emerald-500 to-teal-500\",\"accent\":{\"text\":\"text-emerald-700 dark:text-emerald-300\",\"bg\":\"bg-emerald-50 dark:bg-emerald-500/10\",\"ring\":\"ring-emerald-500/20\"}}},{\"title\":\"Kiểm soát chi phí: dự toán và thực tế (Budget vs Actual)\",\"department\":\"cost-control\",\"summary\":\"Cách thiết lập chu kỳ so sánh dự toán với chi phí thực tế, dùng cost-to-complete và ngưỡng cảnh báo để phát hiện vượt chi sớm.\",\"tags\":[\"kiểm soát chi phí\",\"budget vs actual\",\"cost to complete\"],\"difficulty\":\"Nâng cao\",\"author\":\"Phòng Kiểm soát chi phí\",\"updated\":\"2026-08-05\",\"readingTime\":\"8 phút\",\"featured\":true,\"slug\":\"kiem-soat-chi-phi-du-toan-thuc-te\",\"content\":\"$f\",\"raw\":\"$10\",\"departmentInfo\":{\"slug\":\"cost-control\",\"name\":\"Kiểm soát chi phí\",\"shortName\":\"KS chi phí\",\"description\":\"So sánh dự toán với thực tế, kiểm soát phát sinh và dự báo chi phí hoàn thành.\",\"icon\":\"📉\",\"gradient\":\"from-yellow-500 to-amber-500\",\"accent\":{\"text\":\"text-yellow-700 dark:text-yellow-300\",\"bg\":\"bg-yellow-50 dark:bg-yellow-500/10\",\"ring\":\"ring-yellow-500/20\"}}},{\"title\":\"Thẩm định hiệu quả dự án đầu tư (NPV/IRR)\",\"department\":\"investment\",\"summary\":\"Cách đánh giá hiệu quả tài chính dự án bằng NPV, IRR, thời gian hoàn vốn và chỉ số sinh lời để ra quyết định đầu tư.\",\"tags\":[\"đầu tư\",\"npv\",\"irr\"],\"difficulty\":\"Nâng cao\",\"author\":\"Phòng Đầu tư\",\"updated\":\"2026-08-04\",\"readingTime\":\"8 phút\",\"featured\":true,\"slug\":\"tham-dinh-hieu-qua-dau-tu\",\"content\":\"$11\",\"raw\":\"$12\",\"departmentInfo\":{\"slug\":\"investment\",\"name\":\"Đầu tư\",\"shortName\":\"Đầu tư\",\"description\":\"Thẩm định hiệu quả, phân tích khả thi và ra quyết định đầu tư dự án.\",\"icon\":\"📈\",\"gradient\":\"from-emerald-500 to-green-500\",\"accent\":{\"text\":\"text-emerald-700 dark:text-emerald-300\",\"bg\":\"bg-emerald-50 dark:bg-emerald-500/10\",\"ring\":\"ring-emerald-500/20\"}}},{\"title\":\"Rà soát hợp đồng trước khi ký\",\"department\":\"legal\",\"summary\":\"Checklist pháp lý các điều khoản trọng yếu cần kiểm tra trước khi ký hợp đồng để phòng ngừa rủi ro và tranh chấp.\",\"tags\":[\"hợp đồng\",\"pháp lý\",\"rủi ro\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng Pháp lý\",\"updated\":\"2026-08-04\",\"readingTime\":\"7 phút\",\"featured\":true,\"slug\":\"ra-soat-hop-dong-truoc-khi-ky\",\"content\":\"$13\",\"raw\":\"$14\",\"departmentInfo\":{\"slug\":\"legal\",\"name\":\"Pháp lý\",\"shortName\":\"Pháp lý\",\"description\":\"Rà soát hợp đồng, tuân thủ pháp luật và quản lý rủi ro pháp lý dự án.\",\"icon\":\"⚖️\",\"gradient\":\"from-indigo-500 to-violet-500\",\"accent\":{\"text\":\"text-indigo-700 dark:text-indigo-300\",\"bg\":\"bg-indigo-50 dark:bg-indigo-500/10\",\"ring\":\"ring-indigo-500/20\"}}},{\"title\":\"Nghiệm thu cốt thép trước khi đổ bê tông\",\"department\":\"construction-tech\",\"summary\":\"Checklist kiểm tra công tác cốt thép, cốp pha và vệ sinh trước khi cho phép đổ bê tông.\",\"tags\":[\"cốt thép\",\"nghiệm thu\",\"bê tông\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng Kỹ thuật thi công\",\"updated\":\"2026-08-04\",\"readingTime\":\"6 phút\",\"featured\":true,\"slug\":\"nghiem-thu-cot-thep\",\"content\":\"\\n## Mục tiêu\\n\\nĐảm bảo cốt thép **đúng thiết kế** và đủ điều kiện trước khi đổ bê tông — đây là điểm dừng bắt buộc (hold point).\\n\\n## Kiểm tra cốt thép\\n\\n- [ ] Đúng đường kính, số lượng, khoảng cách theo bản vẽ\\n- [ ] Chiều dài neo, nối chồng đạt yêu cầu\\n- [ ] Buộc chắc chắn, không xê dịch khi đổ\\n- [ ] Con kê bảo đảm chiều dày lớp bảo vệ\\n\\n## Kiểm tra cốp pha \u0026 chi tiết chờ\\n\\n- [ ] Cốp pha kín khít, chống đỡ ổn định\\n- [ ] Kích thước hình học, cao độ, tim trục đúng\\n- [ ] Chi tiết chờ (ống, giằng, bu lông) đúng vị trí\\n- [ ] Vệ sinh sạch trong cốp pha, tưới ẩm nếu cần\\n\\n## Trình tự nghiệm thu\\n\\n1. Nhà thầu tự kiểm tra và mời nghiệm thu.\\n2. Kỹ thuật + QA/QC + TVGS kiểm tra hiện trường.\\n3. Ký biên bản nghiệm thu cốt thép **trước khi** đổ.\\n4. Chỉ đổ bê tông sau khi biên bản được ký.\\n\\n\u003e **Cảnh báo:** Tuyệt đối không đổ bê tông khi chưa có biên bản nghiệm thu cốt thép được ký duyệt.\\n\",\"raw\":\"$15\",\"departmentInfo\":{\"slug\":\"construction-tech\",\"name\":\"Kỹ thuật thi công\",\"shortName\":\"KT thi công\",\"description\":\"Triển khai bản vẽ, biện pháp thi công và nghiệm thu kỹ thuật tại hiện trường.\",\"icon\":\"📐\",\"gradient\":\"from-blue-500 to-cyan-500\",\"accent\":{\"text\":\"text-blue-700 dark:text-blue-300\",\"bg\":\"bg-blue-50 dark:bg-blue-500/10\",\"ring\":\"ring-blue-500/20\"}}},{\"title\":\"Họp giao ban công trường hàng ngày\",\"department\":\"site-management\",\"summary\":\"Cách tổ chức buổi giao ban đầu ngày ngắn gọn để thống nhất công việc, an toàn và tiến độ giữa các tổ đội.\",\"tags\":[\"giao ban\",\"điều hành\",\"tiến độ\"],\"difficulty\":\"Cơ bản\",\"author\":\"Ban chỉ huy công trường\",\"updated\":\"2026-08-04\",\"readingTime\":\"5 phút\",\"featured\":true,\"slug\":\"hop-giao-ban-cong-truong\",\"content\":\"\\n## Mục tiêu\\n\\nĐảm bảo mọi tổ đội **bắt đầu ngày làm việc** với công việc rõ ràng, nhận diện rủi ro an toàn và bám sát tiến độ.\\n\\n## Thời điểm \u0026 thành phần\\n\\n- **Thời gian:** 10-15 phút, đầu mỗi ca làm việc.\\n- **Thành phần:** chỉ huy trưởng/phó, giám sát, tổ trưởng các tổ đội, cán bộ an toàn.\\n\\n## Nội dung cần thống nhất\\n\\n1. **Công việc hôm nay** — hạng mục, vị trí, khối lượng mục tiêu.\\n2. **Nhân lực \u0026 thiết bị** — bố trí tổ đội, máy móc, cẩu tháp.\\n3. **An toàn** — cảnh báo rủi ro của công việc trong ngày.\\n4. **Vướng mắc** — thiếu vật tư, chờ bản vẽ, thời tiết.\\n5. **Tiến độ** — so với kế hoạch tuần, việc cần bù.\\n\\n## Checklist điều hành\\n\\n- [ ] Điểm danh tổ đội và thiết bị\\n- [ ] Giao việc rõ vị trí + khối lượng\\n- [ ] Nhắc nhở an toàn theo công việc\\n- [ ] Ghi nhận vướng mắc \u0026 người xử lý\\n- [ ] Chốt mốc kiểm tra trong ngày\\n\\n\u003e **Mẹo:** Giữ buổi giao ban đứng, ngắn gọn. Vấn đề lớn tách ra họp riêng, tránh kéo dài làm chậm ra quân.\\n\",\"raw\":\"$16\",\"departmentInfo\":{\"slug\":\"site-management\",\"name\":\"Ban chỉ huy công trường\",\"shortName\":\"Chỉ huy CT\",\"description\":\"Điều hành công trường: giao ban, tiến độ, phối hợp thầu phụ và báo cáo.\",\"icon\":\"🏗️\",\"gradient\":\"from-orange-500 to-amber-500\",\"accent\":{\"text\":\"text-orange-700 dark:text-o
