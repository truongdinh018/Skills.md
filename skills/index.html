range-300\",\"bg\":\"bg-orange-50 dark:bg-orange-500/10\",\"ring\":\"ring-orange-500/20\"}}},{\"title\":\"An toàn khi làm việc trên cao\",\"department\":\"hse\",\"summary\":\"Yêu cầu bắt buộc và checklist kiểm tra trước khi cho phép công nhân làm việc trên cao để chống ngã.\",\"tags\":[\"an toàn\",\"làm việc trên cao\",\"hse\"],\"difficulty\":\"Cơ bản\",\"author\":\"Phòng An toàn (HSE)\",\"updated\":\"2026-08-04\",\"readingTime\":\"5 phút\",\"featured\":true,\"slug\":\"an-toan-lam-viec-tren-cao\",\"content\":\"\\n## Mục tiêu\\n\\nNgăn ngừa tai nạn **ngã cao** — nhóm tai nạn nghiêm trọng và phổ biến nhất tại công trường.\\n\\n## Áp dụng khi\\n\\nLàm việc ở độ cao từ **2 mét** trở lên, hoặc nơi có nguy cơ rơi ngã.\\n\\n## Yêu cầu bắt buộc\\n\\n- [ ] Dây an toàn toàn thân + móc kép, neo vào điểm chắc chắn\\n- [ ] Giàn giáo được nghiệm thu, có thẻ (thẻ xanh) còn hiệu lực\\n- [ ] Sàn thao tác đủ rộng, có lan can và chắn chân\\n- [ ] Che chắn/ rào chắn khu vực bên dưới\\n- [ ] Công nhân đủ sức khỏe, đã huấn luyện an toàn\\n\\n## Trước khi bắt đầu\\n\\n1. Kiểm tra thời tiết (gió lớn, mưa, giông → tạm dừng).\\n2. Kiểm tra tình trạng dây, móc, giàn giáo.\\n3. Xác định điểm neo và lối thoát.\\n4. Phổ biến rủi ro cho tổ đội.\\n\\n## Nguyên tắc 100% neo móc\\n\\nLuôn có **ít nhất một móc được neo** trong suốt quá trình di chuyển và làm việc trên cao.\\n\\n\u003e **Cảnh báo:** Không có điểm neo an toàn thì không làm việc trên cao. Dừng công việc và báo cán bộ an toàn.\\n\",\"raw\":\"$17\",\"departmentInfo\":{\"slug\":\"hse\",\"name\":\"An toàn lao động (HSE)\",\"shortName\":\"An toàn\",\"description\":\"An toàn - sức khỏe - môi trường: cấp phép, kiểm tra và ứng phó sự cố.\",\"icon\":\"🦺\",\"gradient\":\"from-red-500 to-orange-500\",\"accent\":{\"text\":\"text-red-700 dark:text-red-300\",\"bg\":\"bg-red-50 dark:bg-red-500/10\",\"ring\":\"ring-red-500/20\"}}},{\"title\":\"Ra quyết định tham gia thầu (Bid / No-bid)\",\"department\":\"estimating\",\"summary\":\"Khung chấm điểm có trọng số giúp quyết định có nên bỏ công sức dự thầu hay không, trước khi dồn nguồn lực lập hồ sơ.\",\"tags\":[\"dự thầu\",\"bid no-bid\",\"đấu thầu\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng Dự toán - Đấu thầu\",\"updated\":\"2026-08-03\",\"readingTime\":\"6 phút\",\"slug\":\"ra-quyet-dinh-tham-gia-thau\",\"content\":\"$18\",\"raw\":\"$19\",\"departmentInfo\":{\"slug\":\"estimating\",\"name\":\"Dự toán - Đấu thầu\",\"shortName\":\"Dự toán\",\"description\":\"Bóc tách khối lượng, lập dự toán và chuẩn bị hồ sơ dự thầu.\",\"icon\":\"🧮\",\"gradient\":\"from-green-500 to-lime-500\",\"accent\":{\"text\":\"text-green-700 dark:text-green-300\",\"bg\":\"bg-green-50 dark:bg-green-500/10\",\"ring\":\"ring-green-500/20\"}}},{\"title\":\"Quản lý hợp đồng thi công và mốc thanh toán\",\"department\":\"contracts\",\"summary\":\"Cách vận hành hợp đồng thi công: theo dõi nghĩa vụ, mốc thanh toán, bảo lãnh, giữ lại và hồ sơ để bảo vệ quyền lợi.\",\"tags\":[\"hợp đồng\",\"thanh toán\",\"quản trị hợp đồng\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng Quản lý hợp đồng\",\"updated\":\"2026-08-03\",\"readingTime\":\"7 phút\",\"slug\":\"quan-ly-hop-dong-thi-cong\",\"content\":\"$1a\",\"raw\":\"$1b\",\"departmentInfo\":{\"slug\":\"contracts\",\"name\":\"Quản lý hợp đồng\",\"shortName\":\"Hợp đồng\",\"description\":\"Quản lý điều khoản, mốc thanh toán, biến động khối lượng và hồ sơ claim.\",\"icon\":\"📃\",\"gradient\":\"from-slate-500 to-gray-500\",\"accent\":{\"text\":\"text-slate-700 dark:text-slate-300\",\"bg\":\"bg-slate-100 dark:bg-slate-500/10\",\"ring\":\"ring-slate-500/20\"}}},{\"title\":\"Lập và kiểm soát tiến độ thi công\",\"department\":\"site-management\",\"summary\":\"Cách lập tiến độ thi công, bám sát thực tế và xử lý khi chậm tiến độ so với kế hoạch.\",\"tags\":[\"tiến độ\",\"kế hoạch\",\"quản lý dự án\"],\"difficulty\":\"Trung bình\",\"author\":\"Ban chỉ huy công trường\",\"updated\":\"2026-08-03\",\"readingTime\":\"7 phút\",\"slug\":\"lap-kiem-soat-tien-do-thi-cong\",\"content\":\"\\n## Mục tiêu\\n\\nGiữ dự án **đúng tiến độ**, phát hiện sớm nguy cơ chậm và có biện pháp bù kịp thời.\\n\\n## Các bước lập tiến độ\\n\\n1. **Chia hạng mục** — bóc công việc theo WBS (móng, thân, hoàn thiện, MEP...).\\n2. **Xác định thời lượng** — dựa trên khối lượng và định mức năng suất.\\n3. **Xác định trình tự \u0026 ràng buộc** — công việc trước/sau, đường găng (critical path).\\n4. **Phân bổ nguồn lực** — nhân công, thiết bị, vật tư theo tuần.\\n5. **Lập mốc kiểm soát** — các milestone quan trọng.\\n\\n## Kiểm soát hàng tuần\\n\\n| Chỉ số | Ý nghĩa |\\n| --- | --- |\\n| % kế hoạch | Khối lượng dự kiến đến thời điểm |\\n| % thực tế | Khối lượng đã hoàn thành |\\n| Chênh lệch | Thực tế − kế hoạch (âm = chậm) |\\n\\n## Khi bị chậm tiến độ\\n\\n- Xác định nguyên nhân gốc (vật tư, thời tiết, nhân lực, bản vẽ).\\n- Ưu tiên **các công việc trên đường găng**.\\n- Cân nhắc tăng ca, tăng tổ đội, hoặc thi công song song.\\n\\n\u003e **Lưu ý:** Chậm một công việc trên đường găng sẽ làm chậm cả dự án — hãy theo dõi đường găng sát sao nhất.\\n\",\"raw\":\"$1c\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:5:departmentInfo\"},{\"title\":\"Quy trình tuyển dụng và phỏng vấn\",\"department\":\"hr\",\"summary\":\"Chuẩn hóa các bước từ mô tả công việc, sàng lọc, phỏng vấn đến ra quyết định tuyển dụng công bằng và hiệu quả.\",\"tags\":[\"tuyển dụng\",\"phỏng vấn\",\"nhân sự\"],\"difficulty\":\"Cơ bản\",\"author\":\"Phòng Nhân sự\",\"updated\":\"2026-08-02\",\"readingTime\":\"6 phút\",\"slug\":\"quy-trinh-tuyen-dung\",\"content\":\"\\n## Mục tiêu\\n\\nTuyển đúng người, đúng việc — dựa trên **tiêu chí rõ ràng**, giảm cảm tính và thiên kiến.\\n\\n## Quy trình\\n\\n1. **Mô tả công việc (JD)** — nhiệm vụ, yêu cầu, tiêu chí đánh giá.\\n2. **Đăng tuyển \u0026 tìm nguồn** — kênh phù hợp với vị trí.\\n3. **Sàng lọc hồ sơ** — theo tiêu chí bắt buộc và ưu tiên.\\n4. **Phỏng vấn** — cấu trúc thống nhất, chấm theo thang điểm.\\n5. **Kiểm tra tham chiếu** — với vị trí quan trọng.\\n6. **Đề nghị \u0026 thương lượng** — lương, thời gian nhận việc.\\n\\n## Phỏng vấn theo cấu trúc\\n\\n- Dùng **bộ câu hỏi chung** cho mọi ứng viên cùng vị trí.\\n- Hỏi theo **tình huống thực tế** (STAR: Situation - Task - Action - Result).\\n- Chấm điểm theo tiêu chí, ghi nhận bằng chứng.\\n\\n## Checklist\\n\\n- [ ] JD rõ nhiệm vụ và tiêu chí\\n- [ ] Bộ câu hỏi phỏng vấn thống nhất\\n- [ ] Thang điểm đánh giá khách quan\\n- [ ] Phản hồi cho ứng viên đúng hẹn\\n\\n\u003e **Mẹo:** Phỏng vấn có cấu trúc và chấm điểm theo tiêu chí dự báo hiệu quả công việc tốt hơn nhiều so với phỏng vấn cảm tính, tự do.\\n\",\"raw\":\"$1d\",\"departmentInfo\":{\"slug\":\"hr\",\"name\":\"Nhân sự\",\"shortName\":\"Nhân sự\",\"description\":\"Tuyển dụng, onboarding, đánh giá và phát triển nhân viên.\",\"icon\":\"🧑‍💼\",\"gradient\":\"from-violet-500 to-purple-500\",\"accent\":{\"text\":\"text-violet-700 dark:text-violet-300\",\"bg\":\"bg-violet-50 dark:bg-violet-500/10\",\"ring\":\"ring-violet-500/20\"}}},{\"title\":\"Quản lý pipeline và dự báo doanh số\",\"department\":\"sales\",\"summary\":\"Cách xây dựng phễu bán hàng theo giai đoạn, cập nhật cơ hội và dự báo doanh số có căn cứ để ra quyết định.\",\"tags\":[\"pipeline\",\"dự báo\",\"bán hàng\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng Kinh doanh\",\"updated\":\"2026-08-02\",\"readingTime\":\"6 phút\",\"slug\":\"quan-ly-pipeline-du-bao-doanh-so\",\"content\":\"$1e\",\"raw\":\"$1f\",\"departmentInfo\":{\"slug\":\"sales\",\"name\":\"Kinh doanh\",\"shortName\":\"Kinh doanh\",\"description\":\"Kịch bản bán hàng, quản lý pipeline, chăm sóc và chốt khách hàng.\",\"icon\":\"🤝\",\"gradient\":\"from-amber-500 to-orange-500\",\"accent\":{\"text\":\"text-amber-700 dark:text-amber-300\",\"bg\":\"bg-amber-50 dark:bg-amber-500/10\",\"ring\":\"ring-amber-500/20\"}}},{\"title\":\"Lập kế hoạch nghiệm thu chất lượng (ITP)\",\"department\":\"qaqc\",\"summary\":\"Cách xây dựng Inspection \u0026 Test Plan xác định điểm kiểm tra, điểm dừng và hồ sơ nghiệm thu cho từng công tác.\",\"tags\":[\"itp\",\"nghiệm thu\",\"chất lượng\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng QA/QC\",\"updated\":\"2026-08-02\",\"readingTime\":\"6 phút\",\"slug\":\"lap-ke-hoach-nghiem-thu-itp\",\"content\":\"\\n## Mục tiêu\\n\\nXác định **kiểm tra cái gì, khi nào, ai làm, theo tiêu chuẩn nào** cho từng công tác thi công.\\n\\n## Thành phần một ITP\\n\\n1. **Hạng mục công tác** — ví dụ: cốt thép, bê tông, xây, tô.\\n2. **Hoạt động kiểm tra/thử nghiệm** — nội dung kiểm tra.\\n3. **Tiêu chuẩn tham chiếu** — TCVN / spec dự án.\\n4. **Loại điểm kiểm soát** — H (Hold), W (Witness), R (Review).\\n5. **Hồ sơ** — biểu mẫu, biên bản, phiếu thí nghiệm.\\n6. **Bên tham gia** — nhà thầu, TVGS, chủ đầu tư.\\n\\n## Phân loại điểm kiểm soát\\n\\n| Ký hiệu | Ý nghĩa |\\n| --- | --- |\\n| H (Hold) | Điểm dừng bắt buộc, phải nghiệm thu mới làm tiếp |\\n| W (Witness) | Mời chứng kiến, có thể tiếp tục nếu vắng mặt |\\n| R (Review) | Xem xét hồ sơ |\\n\\n## Checklist chất lượng ITP\\n\\n- [ ] Bao phủ đủ các công tác chính\\n- [ ] Gắn đúng tiêu chuẩn và tiêu chí chấp nhận\\n- [ ] Xác định rõ điểm H/W/R\\n- [ ] Kèm biểu mẫu hồ sơ tương ứng\\n\\n\u003e **Mẹo:** Đặt điểm Hold ở các công tác bị che khuất sau này (cốt thép, chống thấm) để không phải đục phá kiểm tra về sau.\\n\",\"raw\":\"$20\",\"departmentInfo\":{\"slug\":\"qaqc\",\"name\":\"Quản lý chất lượng (QA/QC)\",\"shortName\":\"QA/QC\",\"description\":\"Kiểm soát chất lượng theo ITP, nghiệm thu và xử lý điểm không phù hợp.\",\"icon\":\"✅\",\"gradient\":\"from-teal-500 to-emerald-500\",\"accent\":{\"text\":\"text-teal-700 dark:text-teal-300\",\"bg\":\"bg-teal-50 dark:bg-teal-500/10\",\"ring\":\"ring-teal-500/20\"}}},{\"title\":\"Lập kế hoạch ngân sách năm\",\"department\":\"finance\",\"summary\":\"Quy trình xây dựng ngân sách năm cho công ty/dự án, gắn với mục tiêu kinh doanh và cơ chế theo dõi thực hiện.\",\"tags\":[\"ngân sách\",\"kế hoạch\",\"tài chính\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng Tài chính - Kế toán\",\"updated\":\"2026-08-01\",\"readingTime\":\"6 phút\",\"slug\":\"lap-ngan-sach-nam\",\"content\":\"\\n## Mục tiêu\\n\\nChuyển mục tiêu kinh doanh thành **kế hoạch tài chính có thể theo dõi**, làm cơ sở kiểm soát chi tiêu cả năm.\\n\\n## Các bước\\n\\n1. **Thu thập giả định** — doanh thu dự kiến, dự án trúng thầu, đơn giá, lạm phát.\\n2. **Lập ngân sách doanh thu** — theo dự án và mốc nghiệm thu.\\n3. **Lập ngân sách chi phí** — trực tiếp (vật tư, nhân công, máy) và gián tiếp (quản lý, văn phòng).\\n4. **Dự phòng** — thường **10-15%** cho biến động giá và rủi ro.\\n5. **Trình duyệt** và phân bổ theo quý/tháng.\\n\\n## Theo dõi thực hiện\\n\\n| Chỉ số | Ý nghĩa |\\n| --- | --- |\\n| Ngân sách | Kế hoạch được duyệt |\\n| Thực tế | Số phát sinh thực |\\n| Chênh lệch | Thực tế − ngân sách |\\n| % thực hiện | Thực tế / ngân sách |\\n\\n## Checklist\\n\\n- [ ] Giả định rõ ràng, có căn cứ\\n- [ ] Có khoản dự phòng hợp lý\\n- [ ] Phân bổ theo kỳ để theo dõi\\n- [ ] Rà soát chênh lệch định kỳ hàng tháng\\n\\n\u003e **Mẹo:** Ngân sách chỉ hữu ích khi được **so sánh với thực tế thường xuyên**; lập xong rồi bỏ quên thì chỉ là con số trên giấy.\\n\",\"raw\":\"$21\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:0:departmentInfo\"},{\"title\":\"Bóc tách khối lượng (BOQ) từ bản vẽ\",\"department\":\"estimating\",\"summary\":\"Phương pháp bóc khối lượng chính xác từ bản vẽ để lập dự toán và kiểm soát vật tư.\",\"tags\":[\"boq\",\"khối lượng\",\"dự toán\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng Dự toán - Đấu thầu\",\"updated\":\"2026-08-01\",\"readingTime\":\"7 phút\",\"slug\":\"boc-tach-khoi-luong-boq\",\"content\":\"\\n## Mục tiêu\\n\\nBóc **đúng và đủ** khối lượng công tác từ bản vẽ làm cơ sở cho dự toán, đấu thầu và kiểm soát vật tư.\\n\\n## Nguyên tắc bóc tách\\n\\n1. Bóc theo **trình tự thi công** (móng → thân → hoàn thiện) để không sót.\\n2. Mỗi công tác ghi rõ **đơn vị** (m³, m², md, kg, cái).\\n3. Bám theo quy tắc đo bóc và định mức áp dụng.\\n4. Ghi chú **diễn giải kích thước** để dễ kiểm tra lại.\\n\\n## Bảng diễn giải mẫu\\n\\n| Công tác | Diễn giải | Đơn vị | Khối lượng |\\n| --- | --- | --- | --- |\\n| Bê tông móng | 2 × (3,0 × 2,0 × 0,5) | m³ | 6,0 |\\n| Cốt thép móng | Theo bảng thống kê thép | kg | 480 |\\n| Ván khuôn móng | Chu vi × chiều cao | m² | 10,0 |\\n\\n## Kiểm soát chất lượng bóc tách\\n\\n- [ ] Đối chiếu bản vẽ kiến trúc − kết cấu − MEP\\n- [ ] Kiểm tra đơn vị và công thức tính\\n- [ ] Rà soát trùng/sót giữa các hạng mục\\n- [ ] Cập nhật theo bản vẽ mới nhất (revision)\\n\\n\u003e **Mẹo:** Luôn lưu công thức diễn giải, đừng chỉ điền con số cuối — khi bản vẽ thay đổi bạn sẽ cập nhật nhanh và dễ soát lỗi.\\n\",\"raw\":\"$22\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:7:departmentInfo\"},{\"title\":\"Quản lý chi phí phát sinh (Variation Order)\",\"department\":\"cost-control\",\"summary\":\"Quy trình kiểm soát thay đổi khối lượng/thiết kế: ghi nhận, định giá và phê duyệt trước khi thi công để tránh 'scope creep'.\",\"tags\":[\"phát sinh\",\"variation\",\"change order\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng Kiểm soát chi phí\",\"updated\":\"2026-07-31\",\"readingTime\":\"6 phút\",\"slug\":\"quan-ly-chi-phi-phat-sinh\",\"content\":\"$23\",\"raw\":\"$24\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:1:departmentInfo\"},{\"title\":\"Quy trình đổ bê tông khối lớn\",\"department\":\"construction-tech\",\"summary\":\"Biện pháp thi công và kiểm soát nhiệt cho cấu kiện bê tông khối lớn nhằm tránh nứt do nhiệt.\",\"tags\":[\"bê tông\",\"khối lớn\",\"biện pháp thi công\"],\"difficulty\":\"Nâng cao\",\"author\":\"Phòng Kỹ thuật thi công\",\"updated\":\"2026-07-31\",\"readingTime\":\"8 phút\",\"slug\":\"do-be-tong-khoi-lon\",\"content\":\"\\n## Mục tiêu\\n\\nĐổ bê tông khối lớn (đài móng, bè móng...) **liên tục, đạt cường độ** và **kiểm soát chênh lệch nhiệt** để tránh nứt.\\n\\n## Chuẩn bị trước khi đổ\\n\\n1. Duyệt cấp phối bê tông (mác, phụ gia, tro bay/xỉ giảm nhiệt).\\n2. Lập biện pháp đổ: hướng đổ, chiều dày lớp, thiết bị dự phòng.\\n3. Bố trí cảm biến đo nhiệt tại tâm và bề mặt khối đổ.\\n4. Chuẩn bị vật liệu bảo dưỡng và giữ nhiệt (bạt, xốp).\\n\\n## Trong khi đổ\\n\\n- Đổ theo lớp, đầm kỹ, tránh phân tầng.\\n- Đổ **liên tục**, kiểm soát mạch ngừng đúng vị trí thiết kế.\\n- Theo dõi độ sụt từng xe, từ chối xe không đạt.\\n\\n## Kiểm soát nhiệt sau khi đổ\\n\\n| Tiêu chí | Ngưỡng khuyến nghị |\\n| --- | --- |\\n| Nhiệt độ tâm khối | ≤ 70 °C |\\n| Chênh lệch tâm − bề mặt | ≤ 20 °C |\\n\\n- Duy trì bảo dưỡng và giữ ẩm liên tục theo quy định.\\n- Ghi nhật ký nhiệt cho tới khi an toàn.\\n\\n\u003e **Lưu ý:** Chênh lệch nhiệt vượt ngưỡng là nguyên nhân chính gây nứt nhiệt — ưu tiên kiểm soát chỉ số này.\\n\",\"raw\":\"$25\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:4:departmentInfo\"},{\"title\":\"Phân tích khả thi và rủi ro dự án đầu tư\",\"department\":\"investment\",\"summary\":\"Khung phân tích khả thi đa chiều (thị trường, kỹ thuật, tài chính, pháp lý) và nhận diện rủi ro trước khi quyết định đầu tư.\",\"tags\":[\"khả thi\",\"rủi ro\",\"đầu tư\"],\"difficulty\":\"Nâng cao\",\"author\":\"Phòng Đầu tư\",\"updated\":\"2026-07-30\",\"readingTime\":\"7 phút\",\"slug\":\"phan-tich-kha-thi-du-an\",\"content\":\"$26\",\"raw\":\"$27\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:2:departmentInfo\"},{\"title\":\"Hạch toán chi phí công trình theo khoản mục\",\"department\":\"finance\",\"summary\":\"Cách phân loại và ghi nhận chi phí công trình theo hệ thống mã chi phí để theo dõi giá thành chính xác.\",\"tags\":[\"kế toán\",\"chi phí\",\"mã chi phí\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng Tài chính - Kế toán\",\"updated\":\"2026-07-30\",\"readingTime\":\"6 phút\",\"slug\":\"hach-toan-chi-phi-cong-trinh\",\"content\":\"$28\",\"raw\":\"$29\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:0:departmentInfo\"},{\"title\":\"Review code hiệu quả\",\"department\":\"engineering\",\"summary\":\"Nguyên tắc và checklist để review pull request nhanh, chất lượng và tôn trọng đồng đội.\",\"tags\":[\"code review\",\"chất lượng\",\"pull request\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng Kỹ thuật\",\"updated\":\"2026-07-30\",\"readingTime\":\"7 phút\",\"featured\":true,\"slug\":\"code-review-hieu-qua\",\"content\":\"\\n## Mục tiêu\\n\\nĐảm bảo mọi thay đổi code được kiểm tra về **tính đúng đắn, khả năng bảo trì và bảo mật** trước khi merge.\\n\\n## Nguyên tắc\\n\\n1. Review **nhỏ và thường xuyên** hơn là dồn một PR khổng lồ.\\n2. Bình luận về **code, không về con người**.\\n3. Phân biệt rõ *bắt buộc sửa* và *góp ý tuỳ chọn* (dùng tiền tố `nit:`).\\n\\n## Checklist khi review\\n\\n- [ ] Thay đổi có giải quyết đúng vấn đề mô tả trong PR không?\\n- [ ] Có test bao phủ phần logic mới không?\\n- [ ] Có xử lý các trường hợp biên (null, rỗng, lỗi mạng)?\\n- [ ] Đặt tên biến/hàm rõ nghĩa?\\n- [ ] Không lộ secret/API key?\\n\\n## Ví dụ bình luận tốt\\n\\n```text\\nnit: Có thể tách hàm này thành helper để tái sử dụng.\\nblocker: Query này thiếu index -\u003e có nguy cơ full scan trên bảng lớn.\\n```\\n\\n## SLA đề xuất\\n\\n| Loại PR | Thời gian phản hồi |\\n| --- | --- |\\n| Hotfix | \u003c 1 giờ |\\n| Thường | \u003c 1 ngày làm việc |\\n\\n\u003e **Lưu ý:** Nếu tranh luận quá 2 vòng bình luận, hãy chuyển sang trao đổi trực tiếp.\\n\",\"raw\":\"$2a\",\"departmentInfo\":{\"slug\":\"engineering\",\"name\":\"Kỹ thuật\",\"shortName\":\"Kỹ thuật\",\"description\":\"Quy trình phát triển phần mềm, review code, vận hành hệ thống và xử lý sự cố.\",\"icon\":\"💻\",\"gradient\":\"from-sky-500 to-indigo-500\",\"accent\":{\"text\":\"text-sky-700 dark:text-sky-300\",\"bg\":\"bg-sky-50 dark:bg-sky-500/10\",\"ring\":\"ring-sky-500/20\"}}},{\"title\":\"Cấp phép công việc nóng (Hot Work Permit)\",\"department\":\"hse\",\"summary\":\"Quy trình cấp phép và kiểm soát các công việc phát sinh nhiệt/tia lửa như hàn, cắt để phòng cháy nổ.\",\"tags\":[\"an toàn\",\"hàn cắt\",\"phòng cháy\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng An toàn (HSE)\",\"updated\":\"2026-07-30\",\"readingTime\":\"5 phút\",\"slug\":\"cap-phep-cong-viec-nong\",\"content\":\"\\n## Mục tiêu\\n\\nKiểm soát công việc sinh nhiệt/tia lửa (hàn, cắt, mài) để **ngăn cháy nổ** tại công trường.\\n\\n## Khi nào cần giấy phép\\n\\nMọi công việc hàn, cắt hơi, mài kim loại, hoặc dùng ngọn lửa trần — đặc biệt gần vật liệu dễ cháy.\\n\\n## Điều kiện trước khi cấp phép\\n\\n- [ ] Dọn sạch vật liệu dễ cháy trong bán kính an toàn\\n- [ ] Bố trí bình chữa cháy phù hợp tại chỗ\\n- [ ] Có người canh lửa (fire watch) trong và sau khi làm\\n- [ ] Che chắn tia lửa, bảo vệ khu vực bên dưới\\n- [ ] Thiết bị hàn/cắt còn tốt, dây tiếp địa đầy đủ\\n\\n## Quy trình\\n\\n1. Người thực hiện đề nghị cấp phép, nêu vị trí \u0026 thời gian.\\n2. Cán bộ an toàn kiểm tra hiện trường theo checklist.\\n3. Cấp giấy phép có **thời hạn** (thường trong ca).\\n4. Giám sát trong khi làm; duy trì canh lửa **tối thiểu 30-60 phút** sau khi xong.\\n5. Đóng giấy phép khi khu vực an toàn.\\n\\n\u003e **Cảnh báo:** Nhiều đám cháy bùng phát *sau khi* thợ hàn rời đi — không bỏ qua bước canh lửa sau công việc.\\n\",\"raw\":\"$2b\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:6:departmentInfo\"},{\"title\":\"Xử lý phiếu không phù hợp (NCR)\",\"department\":\"qaqc\",\"summary\":\"Quy trình phát hành và đóng phiếu Non-Conformance Report khi phát hiện công việc không đạt yêu cầu chất lượng.\",\"tags\":[\"ncr\",\"không phù hợp\",\"chất lượng\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng QA/QC\",\"updated\":\"2026-07-29\",\"readingTime\":\"5 phút\",\"slug\":\"xu-ly-ncr\",\"content\":\"\\n## Mục tiêu\\n\\nXử lý **có hệ thống** các sản phẩm/công tác không đạt, đảm bảo được khắc phục và ngăn tái diễn.\\n\\n## Quy trình NCR\\n\\n1. **Phát hiện \u0026 ghi nhận** — mô tả sai khác so với tiêu chuẩn, kèm ảnh/vị trí.\\n2. **Phân loại phương án xử lý:**\\n   - Sửa chữa (rework) về đúng thiết kế\\n   - Sửa để dùng được (repair) — cần tính toán/duyệt\\n   - Chấp nhận có điều kiện (use-as-is) — phải được duyệt\\n   - Loại bỏ (reject)\\n3. **Phê duyệt phương án** — tư vấn thiết kế / chủ đầu tư khi cần.\\n4. **Thực hiện khắc phục** và kiểm tra lại.\\n5. **Hành động phòng ngừa** — tránh lặp lại.\\n6. **Đóng NCR** — ký xác nhận đã đạt.\\n\\n## Nội dung tối thiểu của phiếu\\n\\n- [ ] Mã NCR, ngày, vị trí, hạng mục\\n- [ ] Mô tả không phù hợp + tiêu chuẩn vi phạm\\n- [ ] Phương án xử lý và người duyệt\\n- [ ] Bằng chứng khắc phục (ảnh, kết quả thí nghiệm)\\n\\n\u003e **Lưu ý:** NCR không phải để \\\"bắt lỗi\\\" cá nhân, mà để kiểm soát chất lượng và cải tiến. Ghi nhận trung thực giúp toàn dự án tốt hơn.\\n\",\"raw\":\"$2c\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:12:departmentInfo\"},{\"title\":\"Tuân thủ pháp lý dự án xây dựng\",\"department\":\"legal\",\"summary\":\"Danh mục hồ sơ pháp lý và giấy phép cần tuân thủ theo các giai đoạn của một dự án xây dựng.\",\"tags\":[\"pháp lý\",\"giấy phép\",\"tuân thủ\"],\"difficulty\":\"Nâng cao\",\"author\":\"Phòng Pháp lý\",\"updated\":\"2026-07-29\",\"readingTime\":\"7 phút\",\"slug\":\"tuan-thu-phap-ly-du-an-xay-dung\",\"content\":\"$2d\",\"raw\":\"$2e\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:3:departmentInfo\"},{\"title\":\"Lập và xử lý hồ sơ claim hợp đồng\",\"department\":\"contracts\",\"summary\":\"Quy trình lập hồ sơ khiếu nại (claim) đòi thêm thời gian/chi phí: tuân thủ thời hạn thông báo và chứng minh bằng hồ sơ đồng thời.\",\"tags\":[\"claim\",\"khiếu nại\",\"hợp đồng\"],\"difficulty\":\"Nâng cao\",\"author\":\"Phòng Quản lý hợp đồng\",\"updated\":\"2026-07-28\",\"readingTime\":\"7 phút\",\"slug\":\"xu-ly-ho-so-claim\",\"content\":\"$2f\",\"raw\":\"$30\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:8:departmentInfo\"},{\"title\":\"Onboarding nhân viên mới trong 30 ngày\",\"department\":\"hr\",\"summary\":\"Lộ trình chuẩn giúp nhân viên mới hội nhập nhanh, rõ vai trò và bắt đầu tạo giá trị trong tháng đầu tiên.\",\"tags\":[\"onboarding\",\"quy trình\",\"văn hóa\"],\"difficulty\":\"Cơ bản\",\"author\":\"Phòng Nhân sự\",\"updated\":\"2026-07-28\",\"readingTime\":\"6 phút\",\"featured\":true,\"slug\":\"onboarding-nhan-vien-moi\",\"content\":\"$31\",\"raw\":\"$32\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:10:departmentInfo\"},{\"title\":\"Quy trình mua và nghiệm thu vật tư đầu vào\",\"department\":\"procurement\",\"summary\":\"Từ đề nghị mua đến nhập kho công trường: kiểm soát chất lượng, chứng từ và số lượng vật tư đầu vào.\",\"tags\":[\"vật tư\",\"mua sắm\",\"nghiệm thu\"],\"difficulty\":\"Cơ bản\",\"author\":\"Phòng Vật tư - Thiết bị\",\"updated\":\"2026-07-28\",\"readingTime\":\"6 phút\",\"slug\":\"mua-nghiem-thu-vat-tu-dau-vao\",\"content\":\"\\n## Mục tiêu\\n\\nĐảm bảo vật tư về công trường **đúng chủng loại, đủ số lượng, đạt chất lượng** và đầy đủ chứng từ.\\n\\n## Quy trình\\n\\n1. **Đề nghị mua** — từ kế hoạch vật tư theo tiến độ.\\n2. **Chọn nhà cung cấp** — so sánh báo giá, năng lực, tiến độ giao.\\n3. **Duyệt \u0026 đặt hàng** — theo hạn mức phê duyệt.\\n4. **Nghiệm thu nhập kho** — kiểm tra khi hàng về.\\n5. **Lưu hồ sơ** — hóa đơn, CO/CQ, phiếu nhập.\\n\\n## Nghiệm thu vật tư khi giao\\n\\n- [ ] Đúng chủng loại, quy cách, mác theo đơn hàng\\n- [ ] Đủ số lượng (cân/đo/đếm thực tế)\\n- [ ] Có chứng chỉ chất lượng (CO/CQ) với vật tư yêu cầu\\n- [ ] Lấy mẫu thí nghiệm với vật tư chịu lực (thép, xi măng, cốt liệu)\\n- [ ] Không hư hỏng, ẩm mốc, gỉ sét\\n\\n## Vật tư cần thí nghiệm đầu vào (ví dụ)\\n\\n| Vật tư | Chỉ tiêu thường kiểm |\\n| --- | --- |\\n| Thép | Giới hạn chảy, độ giãn dài, uốn nguội |\\n| Xi măng | Cường độ, thời gian đông kết |\\n| Cốt liệu | Thành phần hạt, hàm lượng bùn sét |\\n\\n\u003e **Lưu ý:** Không đưa vào sử dụng vật tư chịu lực khi chưa có kết quả thí nghiệm đạt yêu cầu.\\n\",\"raw\":\"$33\",\"departmentInfo\":{\"slug\":\"procurement\",\"name\":\"Vật tư - Thiết bị\",\"shortName\":\"Vật tư\",\"description\":\"Mua sắm, nghiệm thu vật tư đầu vào và quản lý máy móc thiết bị công trường.\",\"icon\":\"🚚\",\"gradient\":\"from-purple-500 to-fuchsia-500\",\"accent\":{\"text\":\"text-purple-700 dark:text-purple-300\",\"bg\":\"bg-purple-50 dark:bg-purple-500/10\",\"ring\":\"ring-purple-500/20\"}}},{\"title\":\"Viết PRD (Product Requirements Document)\",\"department\":\"product\",\"summary\":\"Mẫu tài liệu yêu cầu sản phẩm giúp cả team hiểu vấn đề, giải pháp và tiêu chí thành công.\",\"tags\":[\"prd\",\"sản phẩm\",\"tài liệu\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng Sản phẩm\",\"updated\":\"2026-07-27\",\"readingTime\":\"7 phút\",\"slug\":\"viet-prd-san-pham\",\"content\":\"\\n## Mục tiêu\\n\\nTạo tài liệu để **cả team đồng thuận** về việc *xây gì* và *tại sao*, trước khi viết dòng code đầu tiên.\\n\\n## Cấu trúc PRD\\n\\n1. **Bối cảnh \u0026 Vấn đề** — Ai gặp vấn đề gì, ảnh hưởng ra sao.\\n2. **Mục tiêu \u0026 Chỉ số** — Định nghĩa thành công (metrics).\\n3. **Phạm vi** — Làm gì và **không** làm gì (out of scope).\\n4. **User stories** — \\\"Là [vai trò], tôi muốn [hành động] để [lợi ích]\\\".\\n5. **Yêu cầu chức năng** — Chi tiết hành vi mong muốn.\\n6. **Rủi ro \u0026 Câu hỏi mở**.\\n\\n## Ví dụ tiêu chí thành công\\n\\n```text\\nMục tiêu: Giảm tỷ lệ bỏ giỏ hàng.\\nChỉ số: Tỷ lệ hoàn tất thanh toán tăng từ 60% -\u003e 70% trong 1 tháng.\\n```\\n\\n## Checklist chất lượng PRD\\n\\n- [ ] Vấn đề được nêu rõ ràng, có dữ liệu\\n- [ ] Mục tiêu đo lường được\\n- [ ] Phạm vi (in/out) rõ ràng\\n- [ ] Đã review cùng Kỹ thuật \u0026 Thiết kế\\n\\n\u003e **Mẹo:** PRD tốt trả lời được câu hỏi \\\"làm sao biết đã thành công?\\\".\\n\",\"raw\":\"$34\",\"departmentInfo\":{\"slug\":\"product\",\"name\":\"Sản phẩm\",\"shortName\":\"Sản phẩm\",\"description\":\"Nghiên cứu người dùng, viết PRD, ưu tiên tính năng và roadmap.\",\"icon\":\"🧭\",\"gradient\":\"from-cyan-500 to-blue-500\",\"accent\":{\"text\":\"text-cyan-700 dark:text-cyan-300\",\"bg\":\"bg-cyan-50 dark:bg-cyan-500/10\",\"ring\":\"ring-cyan-500/20\"}}},{\"title\":\"Chuẩn bị hồ sơ dự thầu\",\"department\":\"estimating\",\"summary\":\"Checklist tổ chức lập hồ sơ dự thầu đầy đủ, đúng yêu cầu và nộp đúng hạn để không bị loại vì lỗi hình thức.\",\"tags\":[\"dự thầu\",\"hồ sơ\",\"đấu thầu\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng Dự toán - Đấu thầu\",\"updated\":\"2026-07-27\",\"readingTime\":\"6 phút\",\"slug\":\"chuan-bi-ho-so-du-thau\",\"content\":\"$35\",\"raw\":\"$36\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:7:departmentInfo\"},{\"title\":\"Khóa sổ và lập báo cáo tài chính tháng\",\"department\":\"finance\",\"summary\":\"Checklist các bước khóa sổ cuối tháng để lập báo cáo tài chính đúng hạn, đầy đủ và đối chiếu khớp.\",\"tags\":[\"kế toán\",\"khóa sổ\",\"báo cáo\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng Tài chính - Kế toán\",\"updated\":\"2026-07-26\",\"readingTime\":\"5 phút\",\"slug\":\"khoa-so-bao-cao-thang\",\"content\":\"\\n## Mục tiêu\\n\\nĐóng sổ kế toán tháng **đúng hạn, chính xác, đối chiếu khớp** để có báo cáo phục vụ điều hành.\\n\\n## Trình tự khóa sổ\\n\\n1. **Ghi nhận đầy đủ** hóa đơn, chứng từ trong kỳ.\\n2. **Đối chiếu** ngân hàng, công nợ phải thu/phải trả, kho.\\n3. **Phân bổ \u0026 trích** khấu hao, chi phí trả trước, dự phòng.\\n4. **Rà soát bút toán** bất thường, số dư âm.\\n5. **Kết chuyển** doanh thu - chi phí, xác định kết quả.\\n6. **Lập báo cáo** và giải trình biến động.\\n\\n## Checklist đối chiếu\\n\\n- [ ] Số dư ngân hàng khớp sao kê\\n- [ ] Công nợ khớp biên bản đối chiếu\\n- [ ] Tồn kho khớp kiểm kê\\n- [ ] Chi phí công trình khớp báo cáo công trường\\n- [ ] Thuế GTGT/TNCN đã kê khai\\n\\n## Sản phẩm đầu ra\\n\\n| Báo cáo | Mục đích |\\n| --- | --- |\\n| Bảng cân đối kế toán | Tình hình tài sản - nguồn vốn |\\n| Báo cáo kết quả kinh doanh | Lãi/lỗ trong kỳ |\\n| Báo cáo dòng tiền | Thu - chi tiền mặt |\\n\\n\u003e **Mẹo:** Lập **lịch khóa sổ** với hạn chót cho từng đầu việc và người phụ trách — khóa sổ trễ làm cả chuỗi báo cáo trễ theo.\\n\",\"raw\":\"$37\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:0:departmentInfo\"},{\"title\":\"Lập kế hoạch chiến dịch Marketing\",\"department\":\"marketing\",\"summary\":\"Khung lập kế hoạch chiến dịch từ mục tiêu, đối tượng, thông điệp đến kênh và đo lường.\",\"tags\":[\"chiến dịch\",\"kế hoạch\",\"content\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng Marketing\",\"updated\":\"2026-07-25\",\"readingTime\":\"6 phút\",\"featured\":true,\"slug\":\"lap-ke-hoach-chien-dich-marketing\",\"content\":\"\\n## Mục tiêu\\n\\nXây dựng chiến dịch có **mục tiêu đo lường được** và ngân sách hợp lý.\\n\\n## Khung 5W + Đo lường\\n\\n1. **Why** — Mục tiêu kinh doanh (nhận diện, lead, doanh thu).\\n2. **Who** — Chân dung khách hàng mục tiêu.\\n3. **What** — Thông điệp và ưu đãi cốt lõi.\\n4. **Where** — Kênh triển khai (SEO, ads, email, social).\\n5. **When** — Thời gian và các mốc chính.\\n\\n## KPI gợi ý\\n\\n| Mục tiêu | KPI |\\n| --- | --- |\\n| Nhận diện | Reach, impressions |\\n| Tương tác | CTR, engagement rate |\\n| Chuyển đổi | Số lead, CPL, ROAS |\\n\\n## Checklist trước khi chạy\\n\\n- [ ] Thông điệp thống nhất trên mọi kênh\\n- [ ] Landing page \u0026 tracking (UTM) sẵn sàng\\n- [ ] Ngân sách và lịch chạy được duyệt\\n- [ ] Kế hoạch báo cáo hàng tuần\\n\\n\u003e **Mẹo:** Luôn để lại 10-15% ngân sách để tối ưu dựa trên dữ liệu thực tế.\\n\",\"raw\":\"$38\",\"departmentInfo\":{\"slug\":\"marketing\",\"name\":\"Marketing\",\"shortName\":\"Marketing\",\"description\":\"Xây dựng chiến dịch, content, SEO và đo lường hiệu quả truyền thông.\",\"icon\":\"📣\",\"gradient\":\"from-pink-500 to-rose-500\",\"accent\":{\"text\":\"text-rose-700 dark:text-rose-300\",\"bg\":\"bg-rose-50 dark:bg-rose-500/10\",\"ring\":\"ring-rose-500/20\"}}},{\"title\":\"Chấm công và tính lương công nhân công trường\",\"department\":\"hr\",\"summary\":\"Quy trình chấm công minh bạch và tính lương chính xác cho công nhân, tổ đội tại công trường.\",\"tags\":[\"chấm công\",\"tính lương\",\"công trường\"],\"difficulty\":\"Cơ bản\",\"author\":\"Phòng Nhân sự\",\"updated\":\"2026-07-24\",\"readingTime\":\"5 phút\",\"slug\":\"cham-cong-tinh-luong-cong-nhan\",\"content\":\"\\n## Mục tiêu\\n\\nChấm công **minh bạch**, tính lương **đúng và đúng hạn** cho công nhân và tổ đội tại công trường.\\n\\n## Quy trình\\n\\n1. **Chấm công hàng ngày** — theo tổ đội, có xác nhận của tổ trưởng/giám sát.\\n2. **Tổng hợp cuối kỳ** — công thường, tăng ca, ngày nghỉ, phụ cấp.\\n3. **Đối chiếu khối lượng** — với công việc thực tế/nghiệm thu (nếu khoán).\\n4. **Tính lương** — theo công nhật hoặc khoán khối lượng.\\n5. **Duyệt \u0026 chi trả** — kèm bảng lương chi tiết.\\n\\n## Hình thức trả lương phổ biến\\n\\n| Hình thức | Cách tính |\\n| --- | --- |\\n| Công nhật | Số công × đơn giá ngày công |\\n| Khoán khối lượng | Khối lượng nghiệm thu × đơn giá khoán |\\n\\n## Checklist minh bạch\\n\\n- [ ] Bảng công có xác nhận của tổ trưởng và giám sát\\n- [ ] Đối chiếu công với nhật ký thi công\\n- [ ] Bảng lương công khai cho người lao động\\n- [ ] Lưu chứng từ ký nhận\\n\\n\u003e **Lưu ý:** Chấm công thiếu xác nhận hai chiều (tổ trưởng + giám sát) dễ dẫn tới khai khống hoặc tranh chấp lương.\\n\",\"raw\":\"$39\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:10:departmentInfo\"},{\"title\":\"Xử lý sự cố production (Incident Response)\",\"department\":\"engineering\",\"summary\":\"Quy trình ứng phó sự cố có mức độ ưu tiên rõ ràng, giảm thời gian downtime và học hỏi sau sự cố.\",\"tags\":[\"incident\",\"vận hành\",\"on-call\"],\"difficulty\":\"Nâng cao\",\"author\":\"Phòng Kỹ thuật\",\"updated\":\"2026-07-22\",\"readingTime\":\"8 phút\",\"slug\":\"xu-ly-su-co-production\",\"content\":\"\\n## Mục tiêu\\n\\nKhôi phục dịch vụ **nhanh nhất có thể** và rút ra bài học để không lặp lại.\\n\\n## Phân loại mức độ (Severity)\\n\\n| Mức | Ảnh hưởng | Ví dụ |\\n| --- | --- | --- |\\n| SEV1 | Toàn bộ hệ thống ngừng | Website down hoàn toàn |\\n| SEV2 | Tính năng chính lỗi | Không thanh toán được |\\n| SEV3 | Ảnh hưởng nhỏ | Lỗi hiển thị nhỏ |\\n\\n## Quy trình 5 bước\\n\\n1. **Phát hiện** — Nhận alert hoặc báo cáo từ khách hàng.\\n2. **Điều phối** — Chỉ định một *Incident Commander*.\\n3. **Giảm thiểu** — Ưu tiên khôi phục dịch vụ (rollback, tắt tính năng...).\\n4. **Khắc phục** — Sửa triệt để nguyên nhân gốc.\\n5. **Hậu sự cố** — Viết postmortem **không đổ lỗi** trong 48 giờ.\\n\\n## Mẫu thông báo nội bộ\\n\\n```text\\n[SEV2] Thanh toán gián đoạn\\nBắt đầu: 14:05\\nẢnh hưởng: ~15% giao dịch thất bại\\nĐang xử lý: rollback bản deploy 14:00\\nIC: @ten-nguoi\\n```\\n\\n\u003e **Nguyên tắc vàng:** Khôi phục trước, tìm nguyên nhân gốc sau.\\n\",\"raw\":\"$3a\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:19:departmentInfo\"},{\"title\":\"Xử lý ticket hỗ trợ khách hàng\",\"department\":\"support\",\"summary\":\"Quy trình tiếp nhận, phân loại và phản hồi ticket theo SLA để giữ trải nghiệm khách hàng nhất quán.\",\"tags\":[\"ticket\",\"sla\",\"hỗ trợ\"],\"difficulty\":\"Cơ bản\",\"author\":\"Phòng Chăm sóc khách hàng\",\"updated\":\"2026-07-20\",\"readingTime\":\"5 phút\",\"slug\":\"xu-ly-ticket-ho-tro\",\"content\":\"\\n## Mục tiêu\\n\\nPhản hồi **đúng hạn, đúng người và đúng cách** cho mọi yêu cầu của khách hàng.\\n\\n## Phân loại ưu tiên\\n\\n| Mức | Mô tả | SLA phản hồi đầu |\\n| --- | --- | --- |\\n| Khẩn cấp | Mất dịch vụ hoàn toàn | 30 phút |\\n| Cao | Ảnh hưởng nghiệp vụ chính | 2 giờ |\\n| Thường | Câu hỏi, yêu cầu nhỏ | 1 ngày làm việc |\\n\\n## Quy trình\\n\\n1. **Tiếp nhận \u0026 xác nhận** — Trả lời tự động cho khách biết đã nhận.\\n2. **Phân loại** — Gắn nhãn ưu tiên và chủ đề.\\n3. **Xử lý** — Tự giải quyết hoặc chuyển (escalate) đúng bộ phận.\\n4. **Đóng ticket** — Xác nhận khách đã hài lòng.\\n\\n## Mẫu phản hồi đầu tiên\\n\\n```text\\nChào anh/chị, cảm ơn đã liên hệ.\\nBên em đã tiếp nhận yêu cầu và đang kiểm tra.\\nEm sẽ phản hồi chi tiết trong vòng [SLA].\\n```\\n\\n\u003e **Mẹo:** Một câu xác nhận sớm giúp giảm mạnh sự lo lắng của khách hàng, ngay cả khi chưa có giải pháp.\\n\",\"raw\":\"$3b\",\"departmentInfo\":{\"slug\":\"support\",\"name\":\"Chăm sóc khách hàng\",\"shortName\":\"CSKH\",\"description\":\"Tiếp nhận, phân loại và xử lý yêu cầu hỗ trợ khách hàng.\",\"icon\":\"🎧\",\"gradient\":\"from-fuchsia-500 to-pink-500\",\"accent\":{\"text\":\"text-fuchsia-700 dark:text-fuchsia-300\",\"bg\":\"bg-fuchsia-50 dark:bg-fuchsia-500/10\",\"ring\":\"ring-fuchsia-500/20\"}}},{\"title\":\"Kịch bản gọi điện bán hàng (Cold Call)\",\"department\":\"sales\",\"summary\":\"Cấu trúc cuộc gọi bán hàng chuyên nghiệp: mở đầu, khai thác nhu cầu, xử lý từ chối và chốt bước tiếp theo.\",\"tags\":[\"bán hàng\",\"cold call\",\"kịch bản\"],\"difficulty\":\"Cơ bản\",\"author\":\"Phòng Kinh doanh\",\"updated\":\"2026-07-18\",\"readingTime\":\"5 phút\",\"slug\":\"kich-ban-goi-dien-ban-hang\",\"content\":\"\\n## Mục tiêu\\n\\nBiến một cuộc gọi lạ thành **một cuộc hẹn hoặc bước tiếp theo rõ ràng**.\\n\\n## Cấu trúc cuộc gọi\\n\\n1. **Mở đầu (15 giây):** Chào, giới thiệu ngắn, xin phép 30 giây.\\n2. **Câu hỏi khai thác:** Tìm hiểu vấn đề khách đang gặp.\\n3. **Giá trị:** Kết nối sản phẩm với đúng vấn đề đó.\\n4. **Xử lý từ chối:** Lắng nghe -\u003e đồng cảm -\u003e làm rõ.\\n5. **Chốt bước tiếp theo:** Đặt lịch demo/gửi báo giá.\\n\\n## Mẫu mở đầu\\n\\n```text\\nChào anh/chị, em là ... bên công ty ...\\nEm gọi vì thấy bên mình đang [vấn đề cụ thể].\\nAnh/chị cho em xin 30 giây được không ạ?\\n```\\n\\n## Xử lý từ chối thường gặp\\n\\n| Khách nói | Phản hồi gợi ý |\\n| --- | --- |\\n| \\\"Đang bận\\\" | \\\"Em xin phép gọi lại lúc nào tiện cho anh/chị ạ?\\\" |\\n| \\\"Không quan tâm\\\" | \\\"Dạ em hiểu, cho em hỏi hiện bên mình đang xử lý [vấn đề] thế nào ạ?\\\" |\\n| \\\"Gửi email đi\\\" | \\\"Vâng em gửi ngay, em xin email để gửi đúng người ạ.\\\" |\\n\\n\u003e **Lưu ý:** Mục tiêu của cold call **không phải bán ngay**, mà là mở ra cuộc trò chuyện tiếp theo.\\n\",\"raw\":\"$3c\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:11:departmentInfo\"},{\"title\":\"Quy trình duyệt và thanh toán hóa đơn\",\"department\":\"finance\",\"summary\":\"Chuẩn hóa việc tiếp nhận, kiểm tra, phê duyệt và thanh toán hóa đơn nhằm kiểm soát chi phí và tránh sai sót.\",\"tags\":[\"hóa đơn\",\"thanh toán\",\"kiểm soát\"],\"difficulty\":\"Cơ bản\",\"author\":\"Phòng Tài chính - Kế toán\",\"updated\":\"2026-07-15\",\"readingTime\":\"5 phút\",\"slug\":\"quy-trinh-thanh-toan-hoa-don\",\"content\":\"\\n## Mục tiêu\\n\\nĐảm bảo mọi khoản chi được **kiểm tra và phê duyệt đúng thẩm quyền** trước khi thanh toán.\\n\\n## Quy trình 4 bước\\n\\n1. **Tiếp nhận** — Nhận hóa đơn kèm PO/hợp đồng liên quan.\\n2. **Kiểm tra** — Đối chiếu số tiền, thông tin thuế, người thụ hưởng.\\n3. **Phê duyệt** — Theo hạn mức phê duyệt.\\n4. **Thanh toán \u0026 Lưu trữ** — Thực hiện chi và lưu chứng từ.\\n\\n## Hạn mức phê duyệt (ví dụ)\\n\\n| Giá trị | Người duyệt |\\n| --- | --- |\\n| \u003c 10 triệu | Trưởng phòng |\\n| 10 - 100 triệu | Giám đốc tài chính |\\n| \u003e 100 triệu | Ban giám đốc |\\n\\n## Checklist kiểm tra hóa đơn\\n\\n- [ ] Thông tin công ty \u0026 mã số thuế chính xác\\n- [ ] Có PO/hợp đồng đối chiếu\\n- [ ] Số tiền và thuế đúng\\n- [ ] Chưa từng thanh toán trùng\\n\\n\u003e **Cảnh báo:** Luôn kiểm tra trùng lặp trước khi chi để tránh thanh toán hai lần cho cùng một hóa đơn.\\n\",\"raw\":\"$3d\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:0:departmentInfo\"},{\"title\":\"Nguyên tắc sử dụng Design System\",\"department\":\"product\",\"summary\":\"Hướng dẫn dùng design system nhất quán: token, component và khi nào được tạo ngoại lệ.\",\"tags\":[\"design system\",\"ui\",\"nhất quán\"],\"difficulty\":\"Trung bình\",\"author\":\"Phòng Sản phẩm\",\"updated\":\"2026-07-12\",\"readingTime\":\"6 phút\",\"slug\":\"design-system-nguyen-tac\",\"content\":\"\\n## Mục tiêu\\n\\nGiữ giao diện **nhất quán** và tăng tốc độ phát triển bằng cách tái sử dụng thành phần chung.\\n\\n## Nguyên tắc cốt lõi\\n\\n1. **Ưu tiên component có sẵn** trước khi tạo mới.\\n2. **Dùng design token** (màu, khoảng cách, bo góc) thay vì giá trị cứng.\\n3. **Nhất quán hơn hoàn hảo** — tuân thủ hệ thống kể cả khi có ý tưởng riêng.\\n\\n## Khi nào được tạo ngoại lệ\\n\\n- Có nhu cầu thực sự chưa được hệ thống hỗ trợ.\\n- Đã trao đổi với người phụ trách design system.\\n- Ghi lại lý do để cân nhắc đưa vào hệ thống sau này.\\n\\n## Checklist trước khi merge UI\\n\\n- [ ] Dùng token thay cho màu/spacing cứng\\n- [ ] Tái sử dụng component chung khi có thể\\n- [ ] Kiểm tra trạng thái: hover, focus, disabled\\n- [ ] Kiểm tra khả năng tiếp cận (contrast, aria-label)\\n\\n\u003e **Mẹo:** Mỗi ngoại lệ không ghi lại hôm nay là một khoản \\\"nợ thiết kế\\\" phải trả trong tương lai.\\n\",\"raw\":\"$3e\",\"departmentInfo\":\"$6:props:children:0:props:children:1:props:children:props:skills:26:departmentInfo\"},{\"title\":\"Tối ưu SEO On-page cho bài viết\",\"department\":\"marketing\",\"summary\":\"Checklist tối ưu một bài viết chuẩn SEO: từ khóa, cấu trúc, thẻ meta và liên kết nội bộ.\",\"tags\":[\"seo\",\"content\",\"on-page\"],\"difficulty\":\"Cơ bản\",\"author\":\"Phòng Marketing\",\"updated\":\"2026-07-08\",\"readingTime\":\"5 phút\",\"slug\":\"toi-uu-seo-onpage\",\"content\":\"\\n## Mục tiêu\\n\\nGiúp bài viết **dễ được tìm thấy** trên công cụ tìm kiếm và mang lại traffic bền vững.\\n\\n## Checklist On-page\\n\\n- [ ] Từ kh
